<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trains">
<meta name="theme-color" content="#0C0E11">
<title>SLC Airport → Provo Central</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preload" href="/fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/barlow-condensed-500.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ---------------------------------------------------------------- tokens */
@font-face{
  font-family:'Barlow Condensed';font-style:normal;font-weight:500;
  font-display:swap;src:url('/fonts/barlow-condensed-500.woff2') format('woff2');
}
@font-face{
  font-family:'Barlow Condensed';font-style:normal;font-weight:600;
  font-display:swap;src:url('/fonts/barlow-condensed-600.woff2') format('woff2');
}
:root{
  --bg:#0C0E11;
  --surface:#14171D;
  --surface-2:#1B1F27;
  --hairline:#262B33;
  --text:#F2F0EB;
  --muted:#9AA1AC;
  --faint:#707885;
  --trax:#2EB566;          /* UTA Green Line — its published route color */
  --trax-dim:rgba(46,181,102,.10);
  --fr:#D157C8;            /* FrontRunner #C227B9, lifted for dark-bg contrast */
  --fr-stroke:#C227B9;
  --fr-dim:rgba(194,39,185,.10);
  --amber:#F5B841;
  --amber-dim:rgba(245,184,65,.07);
  --font-display:'Barlow Condensed',ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
/* ---------------------------------------------------------------- base */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-ui);
  min-height:100vh;line-height:1.45;
  padding:calc(env(safe-area-inset-top) + 1.25rem)
          calc(env(safe-area-inset-right) + 1.25rem)
          calc(env(safe-area-inset-bottom) + 2rem)
          calc(env(safe-area-inset-left) + 1.25rem);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--muted);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:2px}
.wrap{max-width:40rem;margin:0 auto}
.mono{font-family:var(--font-mono)}
/* labels: the timetable-annotation voice used everywhere */
.lbl{
  font-family:var(--font-mono);font-size:.65rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
}
/* ---------------------------------------------------------------- header */
header{margin-bottom:1.25rem}
.hd-top{display:flex;align-items:flex-start;gap:.75rem}
.hd-route{position:relative;min-width:0;flex:1}
#routeBtn{
  font-family:var(--font-display);font-weight:600;
  font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.05;letter-spacing:.01em;
  display:flex;align-items:baseline;gap:.45rem;flex-wrap:wrap;text-align:left;
  padding:.2rem 0;
}
#routeBtn .arr{color:var(--faint);font-size:.75em}
#routeBtn svg{align-self:center}
#routeChevron{width:1rem;height:1rem;color:var(--faint);transition:transform .2s}
#routeMenu{
  display:none;position:absolute;z-index:20;left:0;top:100%;margin-top:.5rem;
  min-width:16rem;border:1px solid var(--hairline);border-radius:.75rem;
  background:rgba(20,23,29,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 12px 32px rgba(0,0,0,.5);overflow:hidden;list-style:none;
}
#routeMenu.open{display:block}
.route-opt{
  width:100%;display:flex;align-items:center;gap:.6rem;text-align:left;
  padding:.7rem .9rem;font-size:.9rem;color:var(--muted);
}
.route-opt:hover{background:var(--surface-2);color:var(--text)}
.route-opt.sel{background:var(--surface-2);color:var(--text)}
.route-opt .sw{width:3px;height:1rem;border-radius:2px;flex-shrink:0;
  background:linear-gradient(to bottom,var(--trax),var(--fr-stroke))}
.route-opt svg{width:1rem;height:1rem;color:var(--trax);margin-left:auto;flex-shrink:0}
#refreshBtn{
  display:flex;align-items:center;gap:.35rem;flex-shrink:0;
  font-family:var(--font-mono);font-size:.65rem;color:var(--faint);
  padding:.5rem .4rem .5rem .6rem;margin:-.25rem -.4rem 0 0;
  transition:color .2s;
}
#refreshBtn:hover{color:var(--muted)}
#refreshBtn.is-stale{color:var(--amber)}
#refreshBtn svg{width:.7rem;height:.7rem}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hd-legs{
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  margin-top:.4rem;font-family:var(--font-mono);font-size:.7rem;color:var(--faint);
}
.badge{padding:.1rem .45rem;border-radius:.3rem;font-weight:500;font-size:.7rem}
.badge--trax{background:var(--trax-dim);color:var(--trax)}
.badge--fr{background:var(--fr-dim);color:var(--fr)}
.badge--bus{background:rgba(168,85,247,.10);color:#B57BF0} /* Route 871, for the Adobe routes' return */
.sp-node.n-bus::before{border-color:#A855F7}
.sp-leg.l-bus::before{background:#A855F7}
.sp-legmeta.t-bus{color:#B57BF0}
.hd-legs .sep{color:var(--hairline)}
#weekendHint{display:none;color:var(--amber);font-style:italic}
#weekendHint.show{display:inline}
/* ---------------------------------------------------------------- controls */
.controls{margin-bottom:1rem}
#controlsPill{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  padding:.8rem 1rem;border:1px solid var(--hairline);border-radius:.75rem;
  background:var(--surface);transition:border-color .2s;
}
#controlsPill:hover{border-color:var(--faint)}
#controlsSummary{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);text-align:left}
#controlsChevron{width:1rem;height:1rem;color:var(--faint);transition:transform .2s;flex-shrink:0}
#controlsDrawer{
  display:none;margin-top:.5rem;padding:.75rem;flex-wrap:wrap;align-items:center;gap:.5rem;
  border:1px solid var(--hairline);border-radius:.75rem;background:var(--surface);
}
#controlsDrawer.open{display:flex}
.seg{display:inline-flex;border:1px solid var(--hairline);border-radius:.55rem;background:var(--bg);padding:2px}
.seg-btn{
  padding:.6rem .8rem;font-family:var(--font-mono);font-size:.75rem;font-weight:500;
  border-radius:.4rem;color:var(--faint);transition:color .15s;
}
.seg-btn:hover{color:var(--muted)}
.seg-btn.is-active{background:var(--surface-2);color:var(--text)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--hairline);border-radius:.55rem;background:var(--bg);position:relative}
.stepper .st-btn{padding:.8rem .7rem;color:var(--faint);transition:color .15s;display:flex}
.stepper .st-btn:hover{color:var(--text)}
.stepper .st-btn:active{transform:scale(.95)}
.stepper .st-btn svg{width:.85rem;height:.85rem}
.stepper input[type=date],.stepper .st-val{
  background:transparent;border:0;border-left:1px solid var(--hairline);border-right:1px solid var(--hairline);
  padding:.75rem .5rem;font-family:var(--font-mono);font-size:.8rem;color:var(--muted);
  text-align:center;white-space:nowrap;
}
.stepper input[type=date]{width:8.5rem;color-scheme:dark}
.stepper .st-val{width:5.75rem}
.stepper .st-val:hover{color:var(--text)}
#nowBtn{
  padding:.75rem .9rem;border:1px solid var(--hairline);border-radius:.55rem;background:var(--bg);
  font-size:.8rem;font-weight:500;color:var(--muted);transition:color .15s,border-color .15s;
}
#nowBtn:hover{color:var(--text);border-color:var(--faint)}
#nowBtn:active{transform:scale(.97)}
#timePopover{
  display:none;position:absolute;top:100%;left:0;right:0;margin-top:.25rem;z-index:20;
  border:1px solid var(--hairline);border-radius:.55rem;background:var(--surface-2);
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-height:16rem;overflow-y:auto;min-width:8rem;
}
#timePopover.open{display:block}
.pop-item{
  display:block;width:100%;text-align:left;padding:.6rem .9rem;
  font-family:var(--font-mono);font-size:.8rem;color:var(--muted);
}
.pop-item:hover{background:var(--bg);color:var(--text)}
.pop-item.is-current{background:var(--bg);color:var(--text)}
/* ---------------------------------------------------------------- board: hero */
.hero{
  border:1px solid var(--hairline);border-radius:1rem;background:var(--surface);
  padding:1.15rem 1.25rem 1.05rem;
}
.hero-eyebrow{
  font-family:var(--font-display);font-size:1.15rem;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text);margin-bottom:1rem;
}
.hero-eyebrow.calm{color:var(--muted)}
.hero-eyebrow.hot{color:var(--amber)}
/* the route spine — the actual journey drawn in the lines' own colors */
.spine{display:grid;grid-template-columns:1.1rem 1fr;column-gap:.85rem}
.sp-node{position:relative;z-index:1}
.sp-node::before{
  content:'';position:absolute;left:50%;top:.3rem;transform:translateX(-50%);
  width:.8rem;height:.8rem;border-radius:50%;background:var(--surface);z-index:1;
  border:3px solid var(--muted);
}
.sp-node.n-trax::before{border-color:var(--trax)}
.sp-node.n-fr::before{border-color:var(--fr-stroke)}
.sp-node.n-xfer::before{top:.1rem;width:.65rem;height:.65rem;border-width:2.5px;border-color:var(--text)}
.sp-leg{position:relative;min-height:1.9rem}
.sp-leg::before{
  content:'';position:absolute;left:50%;top:-0.9rem;bottom:-0.9rem;transform:translateX(-50%);
  width:3px;border-radius:2px;
}
.sp-leg.l-trax::before{background:var(--trax)}
.sp-leg.l-fr::before{background:var(--fr-stroke)}
.sp-station{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;padding-bottom:.35rem}
.sp-time{
  font-family:var(--font-display);font-weight:600;font-size:2.35rem;line-height:1;
  letter-spacing:.005em;color:var(--text);font-variant-numeric:tabular-nums;
}
.sp-time .ap{font-size:.55em;font-weight:500;color:var(--muted);margin-left:.1em}
.sp-time.dest{color:var(--text)}
.sp-name{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.delay-chip{
  font-family:var(--font-mono);font-size:.65rem;font-weight:600;color:var(--amber);
  background:var(--amber-dim);border:1px solid rgba(245,184,65,.3);
  padding:.1rem .4rem;border-radius:.3rem;align-self:center;
}
.risk-note{
  margin-top:.75rem;padding:.5rem .7rem;border-radius:.55rem;
  border:1px solid rgba(245,184,65,.3);background:var(--amber-dim);
  font-family:var(--font-mono);font-size:.7rem;color:var(--amber);
}
.sp-legmeta{
  display:flex;align-items:center;padding:.15rem 0 .5rem;
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
}
.sp-legmeta.t-trax{color:var(--trax)}
.sp-legmeta.t-fr{color:var(--fr)}
.sp-legmeta .ride{color:var(--faint);margin-left:.5rem;letter-spacing:.05em;text-transform:none}
.sp-xfer{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;padding-bottom:.35rem}
.sp-xfer-time{
  font-family:var(--font-display);font-weight:500;font-size:1.25rem;line-height:1.1;
  color:var(--muted);font-variant-numeric:tabular-nums;
}
.sp-xfer-wait{font-family:var(--font-mono);font-size:.65rem;color:var(--faint)}
.hero-foot{
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--hairline);
}
.hero-total{
  font-family:var(--font-mono);font-size:.7rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text);
}
.hero-alts{font-family:var(--font-mono);font-size:.65rem;color:var(--faint);flex:1;min-width:12rem}
.hero-alts b{color:var(--muted);font-weight:500}
/* ---------------------------------------------------------------- board: rows */
.row{
  display:flex;align-items:baseline;gap:.75rem;
  padding:.65rem .9rem;border:1px solid var(--hairline);border-radius:.65rem;
  background:transparent;font-family:var(--font-mono);font-size:.85rem;
}
.row--earlier{margin-bottom:.6rem}
.row--later{margin-top:.6rem}
.row .r-kind{font-size:.6rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);width:3.6rem;flex-shrink:0}
.row .r-dep{color:var(--text);font-variant-numeric:tabular-nums}
.row .r-arrow{color:var(--faint)}
.row .r-arr{color:var(--muted);font-variant-numeric:tabular-nums}
.row .r-fill{flex:1}
.row .r-total{font-size:.7rem;color:var(--faint);font-variant-numeric:tabular-nums}
.row .r-in{font-size:.7rem;color:var(--faint);font-variant-numeric:tabular-nums;width:3.2rem;text-align:right}
/* ---------------------------------------------------------------- notices */
.notice{
  margin-bottom:.75rem;padding:.6rem .8rem;border-radius:.65rem;border:1px solid;
  font-family:var(--font-mono);font-size:.68rem;line-height:1.55;
}
.notice--amber{color:rgba(245,184,65,.85);background:var(--amber-dim);border-color:rgba(245,184,65,.25)}
.notice--green{color:rgba(110,220,155,.9);background:rgba(46,181,102,.06);border-color:rgba(46,181,102,.3)}
.notice-link{margin-left:.5rem;text-decoration:underline;text-underline-offset:2px}
.notice-link:hover{color:var(--text)}
.notice-detail{display:none;margin-top:.4rem;opacity:.85}
.notice-detail.open{display:block}
.row--past{opacity:.45}
.empty{
  padding:3rem 1rem;text-align:center;border-radius:1rem;border:1px solid var(--hairline);
  font-family:var(--font-mono);font-size:.85rem;color:var(--faint);background:var(--surface);
}
.empty--warn{color:rgba(245,184,65,.8);background:var(--amber-dim);border-color:rgba(245,184,65,.2)}
.gap-card{
  padding:2.5rem 1.25rem;text-align:center;border-radius:1rem;
  border:1px solid rgba(245,184,65,.2);background:var(--amber-dim);
  font-family:var(--font-mono);font-size:.85rem;line-height:1.6;color:rgba(245,184,65,.85);
}
.gap-actions{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.btn-amber{
  padding:.45rem .8rem;border:1px solid rgba(245,184,65,.3);border-radius:.55rem;
  font-size:.75rem;color:var(--amber);transition:background .15s;
}
.btn-amber:hover{background:rgba(245,184,65,.1)}
.btn-ghost{
  padding:.45rem .8rem;border:1px solid var(--hairline);border-radius:.55rem;
  font-size:.75rem;color:var(--muted);transition:background .15s;
}
.btn-ghost:hover{background:var(--surface-2)}
.btn-amber:active,.btn-ghost:active{transform:scale(.96)}
.loading{display:flex;align-items:center;justify-content:center;gap:.75rem;padding:3rem 0;color:var(--faint);font-family:var(--font-mono);font-size:.8rem}
/* ------------------------------------------------------------- schedule sheet */
#sheetOverlay{
  display:none;position:fixed;inset:0;z-index:40;
  background:rgba(6,8,10,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
#sheetOverlay.open{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-width:40rem;margin:0 auto;max-height:72vh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--hairline);border-bottom:0;
  border-radius:1.1rem 1.1rem 0 0;
  padding-bottom:env(safe-area-inset-bottom);
  animation:sheetUp .28s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1rem 1.1rem .75rem;border-bottom:1px solid var(--hairline);flex-shrink:0;
}
.sheet-title{font-family:var(--font-display);font-weight:600;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase}
.sheet-sub{font-family:var(--font-mono);font-size:.65rem;color:var(--faint);margin-top:.1rem}
.sheet-close{
  padding:.5rem;margin:-.5rem;color:var(--faint);display:flex;transition:color .15s;
}
.sheet-close:hover{color:var(--text)}
.sheet-close svg{width:1.15rem;height:1.15rem}
.sheet-body{overflow-y:auto;padding:.5rem .6rem 1rem;-webkit-overflow-scrolling:touch}
.m-row{
  width:100%;display:flex;align-items:baseline;gap:.75rem;text-align:left;
  padding:.7rem .6rem;border-radius:.55rem;
  font-family:var(--font-mono);font-size:.85rem;
}
.m-row:hover{background:var(--surface-2)}
.m-row .r-dep{color:var(--text);font-variant-numeric:tabular-nums;width:4.6rem}
.m-row .r-arrow{color:var(--faint)}
.m-row .r-arr{color:var(--muted);font-variant-numeric:tabular-nums;width:4.6rem}
.m-row .r-fill{flex:1}
.m-row .r-total{font-size:.7rem;color:var(--faint);font-variant-numeric:tabular-nums}
.m-row .r-in{font-size:.7rem;color:var(--faint);font-variant-numeric:tabular-nums;width:3.4rem;text-align:right}
.m-row.sel{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--trax)}
.m-row.past{opacity:.4}
.row-btn{cursor:pointer;transition:border-color .15s}
.row-btn:hover{border-color:var(--faint)}
.hero-more{
  margin-left:auto;font-family:var(--font-mono);font-size:.65rem;color:var(--faint);
  letter-spacing:.05em;transition:color .15s;flex-shrink:0;
}
.hero-more:hover{color:var(--text)}
/* --------------------------------------------------------------- quick actions */
.quick{margin-bottom:1rem;display:none}
.quick.show{display:block}
#landedBtn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.7rem 1rem;border:1px dashed var(--hairline);border-radius:.75rem;
  font-family:var(--font-mono);font-size:.75rem;color:var(--muted);transition:color .15s,border-color .15s;
}
#landedBtn:hover{color:var(--text);border-color:var(--faint)}
#landedBtn:active{transform:scale(.985)}
/* ---------------------------------------------------------------- footer */
.foot{margin-top:1.5rem;padding-top:.75rem;border-top:1px solid var(--hairline)}
#feedNoteToggle{display:flex;align-items:center;gap:.3rem;font-family:var(--font-mono);font-size:.65rem;color:var(--faint);transition:color .15s}
#feedNoteToggle:hover{color:var(--muted)}
#feedNoteToggle svg{width:.7rem;height:.7rem;transition:transform .2s}
#feedNote{display:none;margin-top:.5rem;font-family:var(--font-mono);font-size:.65rem;color:var(--faint)}
#feedNote.open{display:block}
/* ---------------------------------------------------------------- splash */
#splash{
  position:fixed;inset:0;z-index:100;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;
  background:var(--bg);
}
#splash.on{display:flex}
#splash.done{animation:splFade .3s ease-out .75s both}
.spl-word{
  font-family:var(--font-display);font-weight:600;font-size:1.3rem;
  letter-spacing:.55em;text-indent:.55em;color:var(--text);
  animation:splWord .5s ease-out .3s both;
}
.spl-leg{stroke-dasharray:43;stroke-dashoffset:43;animation:splDraw .32s cubic-bezier(.2,.7,.3,1) forwards}
.spl-l2{animation-delay:.22s}
.spl-dot{transform-origin:center;transform-box:fill-box;transform:scale(0);animation:splPop .25s cubic-bezier(.2,.9,.3,1.4) forwards}
.spl-d1{animation-delay:.05s}
.spl-d2{animation-delay:.28s}
.spl-d3{animation-delay:.5s}
@keyframes splDraw{to{stroke-dashoffset:0}}
@keyframes splPop{to{transform:scale(1)}}
@keyframes splWord{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.55em}}
@keyframes splFade{to{opacity:0;visibility:hidden}}
/* --------------------------------------------------------------- offline dot */
#netDot{
  width:.5rem;height:.5rem;border-radius:50%;flex-shrink:0;display:none;
}
#netDot.ready{display:block;background:var(--trax)}
#netDot.off{display:block;background:var(--amber);animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{50%{opacity:.4}}
/* ---------------------------------------------------------------- motion */
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes growIn{from{transform:translateX(-50%) scaleY(0)}to{transform:translateX(-50%) scaleY(1)}}
.row-enter{animation:riseIn .3s ease-out both}
.hero.row-enter .sp-leg::before{transform-origin:top;animation:growIn .45s cubic-bezier(.2,.7,.3,1) both}
.hero.row-enter .sp-leg.l-fr::before{animation-delay:.12s}
.hero.row-enter .spine,.hero.row-enter .hero-foot{animation:riseIn .35s ease-out both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:380px){

    if(cached&&cached.stopTimes&&cached.stopTimes.length&&cached.generatedAt&&
       (!GTFS.generatedAt||new Date(cached.generatedAt)>new Date(GTFS.generatedAt)))
      GTFS=cached;
  }catch(e){}
  function cacheGTFS(d){
    lsSet(GTFS_CACHE_KEY,JSON.stringify(d));
  }
  function dstr(y,m,d){return String(y)+String(m).padStart(2,'0')+String(d).padStart(2,'0')}
  // The server keeps the feed covering today at top level and any other
  // still-valid service period in `feeds`; the embedded snapshot is the last
  // resort. Order here is the preference order.
  function allFeeds(){
    var list=[GTFS];
    if(GTFS&&Array.isArray(GTFS.feeds)) list=list.concat(GTFS.feeds);
    if(GTFS_EMBEDDED!==GTFS) list.push(GTFS_EMBEDDED);
    return list.filter(function(f){
      return f&&f.feedStart&&f.feedEnd&&f.stopTimes&&f.stopTimes.length;
    });
  }
  function coveringFeed(ds){
    var list=allFeeds();
    for(var i=0;i<list.length;i++){
      if(list[i].feedStart<=ds&&ds<=list[i].feedEnd) return list[i];
    }
    return null;
  }
  function nextCoveredDate(ds){
    var starts=allFeeds().map(function(f){return f.feedStart})
      .filter(function(s){return s>ds}).sort();
    return starts.length?starts[0]:null;
  }
  function pickFeed(y,m,d){
    return coveringFeed(dstr(y,m,d))||GTFS;
  }
  // Opt-in only: during a coverage gap the user can choose to read the
  // nearest published timetable as an approximation. Never on by default —
  // these are guessed times, not UTA's.
  // ON by default during a coverage gap. Rail estimates are verified exact
  // against UTA's own Apr-2026 and Fall-2026 timetables and Transitland's
  // archive, and the one route where estimating is unsafe (871) is refused
  // outright in resolveFeed — so a blank board helps nobody. An explicit
  // "Hide estimates" is still remembered.
  var APPROX_ON=true;
  try{
    var _ap=lsGet('transit.approx');
    if(_ap!==null) APPROX_ON=(_ap==='1');
  }catch(e){}
  function setApprox(v){
    APPROX_ON=v;
    lsSet('transit.approx',v?'1':'0');
    update();
  }
  function dsToDate(ds){
    return new Date(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6,8));
  }
  function dayGap(a,b){
    return Math.round((dsToDate(b)-dsToDate(a))/86400000);
  }
  // Distance in real days — YYYYMMDD subtraction lies across month ends.
  function nearestFeed(ds){
    var best=null,bestD=Infinity;
    allFeeds().forEach(function(f){
      var dist=f.feedStart>ds?dayGap(ds,f.feedStart):(f.feedEnd<ds?dayGap(f.feedEnd,ds):0);
      if(dist<bestD){bestD=dist;best=f}
    });
    return best;
  }
  // Times only mean anything if the weekday matches, so map the requested
  // date onto the first same-weekday date inside the feed's valid range.
  function proxyDate(ds,feed){
    var want=dsToDate(ds).getDay(),c=dsToDate(feed.feedStart);
    for(var i=0;i<7&&c.getDay()!==want;i++) c.setDate(c.getDate()+1);
    var first=dstr(c.getFullYear(),c.getMonth()+1,c.getDate());
    // The first same-weekday date can be a holiday with no service. Walk
    // forward a week at a time until one actually runs trains.
    if(typeof getActiveServicesDs==='function'){
      var probe=new Date(c.getTime());
      for(var w=0;w<8;w++){
        var pd=dstr(probe.getFullYear(),probe.getMonth()+1,probe.getDate());
        if(pd>feed.feedEnd) break;
        if(getActiveServicesDs(pd,feed).size>0) return pd;
        probe.setDate(probe.getDate()+7);
      }
    }
    return first;
  }
  // null => nothing usable for this date; approx=true => times are estimated.
  function resolveFeed(y,m,d){
    var ds=dstr(y,m,d),f=coveringFeed(ds);
    if(f) return {feed:f,ds:ds,approx:false,requested:ds};
    // Route 871's timetable is NOT stable across service changes — verified
    // 2026-08: the Adobe->Lehi run moved from :53 to :55, so estimating from
    // the next pick would send you to the stop two minutes after the bus left,
    // on an hourly route. Rail estimates are exact (checked against UTA's own
    // Apr-2026 and Fall-2026 timetables), so only the 871 legs are withheld.
    if(APPROX_ON&&!isAdobeRoute(DIRECTION)){
      var n=nearestFeed(ds);
      if(n) return {feed:n,ds:proxyDate(ds,n),approx:true,source:n,requested:ds};
    }
    return null;
  }

  function utahNow(){
    return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Denver'}));
  }
  function utahToday(){
    var n=utahNow();
    return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate(),h:n.getHours(),mi:n.getMinutes()};
  }
  function timeToMin(t){
    var p=t.trim().split(':').map(Number);
    return p[0]*60+p[1]+(p[2]?p[2]/60:0);
  }
  function minToDisplay(m){
    m=Math.round(((m%1440)+1440)%1440)%1440;   // round to a whole minute FIRST, or :60 can print
    var h=Math.floor(m/60),mi=m%60,ap=h>=12?'PM':'AM';
    h=h%12||12;
    return h+':'+String(mi).padStart(2,'0')+' '+ap;
  }
  function fmtDate(s){
    if(!s||s.length<8)return s;
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[parseInt(s.slice(4,6))-1]+' '+parseInt(s.slice(6,8))+', '+s.slice(0,4);
  }
  var DOW=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];

  var DIRECTIONS={
    airportToProvo:{
      origin:'SLC Airport',dest:'Provo Central',transferName:'N. Temple',
      leg1:{label:'Green Line',color:'trax',tripsKey:'trips704',fromKey:'airportStops',toKey:'transferTrax',fromName:'Airport'},
      leg2:{label:'FrontRunner',color:'fr',tripsKey:'trips750',fromKey:'transferFR',toKey:'provoStops',destName:'Provo'}
    },
    provoToAirport:{
      origin:'Provo Central',dest:'SLC Airport',transferName:'N. Temple',
      leg1:{label:'FrontRunner',color:'fr',tripsKey:'trips750',fromKey:'provoStops',toKey:'transferFR',fromName:'Provo'},
      leg2:{label:'Green Line',color:'trax',tripsKey:'trips704',fromKey:'transferTrax',toKey:'airportStops',destName:'Airport'}
    },
    // --- Route 871 / Adobe Lehi: temporarily disabled in the UI ---------------
    // Hidden while UTA's published feed doesn't cover the current dates. Unlike
    // rail, 871's timetable really does move between service changes (Aug 2026:
    // Lehi->Sandy +11 min, Adobe->Lehi -2 min), so it can't be shown safely
    // during a coverage gap. The data pipeline still fetches and archives 871,
    // so re-enabling is just uncommenting this block and its ROUTE_ORDER entry.
    // provoToAdobe:{
    //   origin:'Provo Central',dest:'Adobe Lehi',transferName:'Lehi Stn',
    //   leg1:{label:'FrontRunner',color:'fr',tripsKey:'trips750',fromKey:'provoStops',toKey:'lehiFRStops',fromName:'Provo'},
    //   leg2:{label:'Route 871',color:'bus',tripsKey:'trips871',fromKey:'lehiBusStops',toKey:'adobeStops',destName:'Adobe'}
    // },
    // adobeToProvo:{
    //   origin:'Adobe Lehi',dest:'Provo Central',transferName:'Lehi Stn',
    //   leg1:{label:'Route 871',color:'bus',tripsKey:'trips871',fromKey:'adobeStops',toKey:'lehiBusStops',fromName:'Adobe'},
    //   leg2:{label:'FrontRunner',color:'fr',tripsKey:'trips750',fromKey:'lehiFRStops',toKey:'provoStops',destName:'Provo'}
    // }
    // -------------------------------------------------------------------------
  };
  var DIRECTION=lsGet('transit.route');
  if(!DIRECTION){
    var legacy=lsGet('transit.direction');
    DIRECTION=legacy==='toAirport'?'provoToAirport':'airportToProvo';
  }
  if(!DIRECTIONS[DIRECTION]) DIRECTION='airportToProvo';
  var MODE=lsGet('transit.mode')||'depart';
  var FOLLOW_NOW=true;   // tracking the live clock until the user picks a time
  if(MODE!=='depart'&&MODE!=='arrive') MODE='depart';

  function getActiveServices(y,m,d,feed){
    return getActiveServicesDs(dstr(y,m,d),feed);
  }
  function getActiveServicesDs(ds,feed){
    var dow=DOW[dsToDate(ds).getDay()];
    var active=new Set();
    feed.calendar.forEach(function(c){
      if(c.start_date<=ds&&c.end_date>=ds&&c[dow]==='1') active.add(c.service_id);
    });
    feed.calDates.forEach(function(cd){
      if(cd.date===ds){
        if(cd.exception_type==='1') active.add(cd.service_id);
        if(cd.exception_type==='2') active.delete(cd.service_id);
      }
    });
    return active;
  }

  function buildLegs(services,stByTrip,tripsKey,fromKey,toKey,feed){
    var legs=[];
    var fromStops=feed[fromKey],toStops=feed[toKey];
    Object.keys(feed[tripsKey]).forEach(function(tid){
      if(!services.has(feed[tripsKey][tid]))return;
      var sts=stByTrip[tid];if(!sts)return;
      var dep=null,arr=null;
      sts.forEach(function(st){
        if(fromStops.indexOf(st[1])!==-1&&st[3]) dep=timeToMin(st[3]);
        if(toStops.indexOf(st[1])!==-1&&st[2]) arr=timeToMin(st[2]);
      });
      if(dep!==null&&arr!==null&&arr>dep)
        legs.push({dep:dep,arr:arr,ride:Math.round(arr-dep),tid:tid});
    });
    legs.sort(function(a,b){return a.dep-b.dep});
    return legs;
  }

  function getConnections(y,m,d,dirKey){
    var dir=DIRECTIONS[dirKey||DIRECTION];
    var res=resolveFeed(y,m,d);
    if(!res) return [];
    var feed=res.feed;
    var services=getActiveServicesDs(res.ds,feed);
    var stByTrip={};
    feed.stopTimes.forEach(function(st){
      if(!stByTrip[st[0]]) stByTrip[st[0]]=[];
      stByTrip[st[0]].push(st);
    });

    var legs1=buildLegs(services,stByTrip,dir.leg1.tripsKey,dir.leg1.fromKey,dir.leg1.toKey,feed);
    var legs2=buildLegs(services,stByTrip,dir.leg2.tripsKey,dir.leg2.fromKey,dir.leg2.toKey,feed);

    // Pair with 5-min walk/transfer buffer
    var connections=[];
    legs1.forEach(function(l1){
      var l2=legs2.find(function(f){return f.dep>=l1.arr+5});
      if(l2) connections.push({
        leg1Dep:l1.dep,xferArr:l1.arr,leg1Ride:l1.ride,leg1Tid:l1.tid,
        xferDep:l2.dep,wait:Math.round(l2.dep-l1.arr),
        finalArr:l2.arr,leg2Ride:l2.ride,leg2Tid:l2.tid
      });
    });
    connections.sort(function(a,b){return a.leg1Dep-b.leg1Dep});
    var seen=new Set(),unique=[];
    connections.forEach(function(c){
      var k=c.leg1Dep+'|'+c.xferDep;
      if(!seen.has(k)){seen.add(k);unique.push(c)}
    });
    return unique;
  }

  // DOM helpers
  function clearEl(el){while(el.firstChild)el.removeChild(el.firstChild)}
  function txt(s){return document.createTextNode(s)}
  function mkEl(tag,cls,children){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(children){
      (Array.isArray(children)?children:[children]).forEach(function(c){
        if(typeof c==='string')e.appendChild(txt(c));
        else if(c)e.appendChild(c);
      });
    }
    return e;
  }

  function renderEmpty(msg,tone){
    return mkEl('div','empty'+(tone==='warn'?' empty--warn':''),[msg]);
  }

  // Distinct from renderEmpty: "we have no timetable for this date at all" is
  // a different situation from "we looked and there are no trains".
  function renderGap(msg,nextStart,near){
    var box=mkEl('div','gap-card',[msg]);
    var row=mkEl('div','gap-actions');
    if(nextStart){
      var btn=mkEl('button','btn-amber',['Jump to '+fmtDate(nextStart)]);
      btn.addEventListener('click',function(){
        document.getElementById('dateInput').value=
          nextStart.slice(0,4)+'-'+nextStart.slice(4,6)+'-'+nextStart.slice(6,8);
        update();
      });
      row.appendChild(btn);
    }
    if(near){
      var alt=mkEl('button','btn-ghost',['Estimate from '+fmtDate(near.feedStart)+' timetable']);
      alt.addEventListener('click',function(){setApprox(true)});
      row.appendChild(alt);
    }
    if(row.childNodes.length) box.appendChild(row);
    return box;
  }

  // Early warning: coverage lapsing is the failure that strands you, so say it
  // days ahead rather than at the moment the board goes empty.
  function coverageWarning(){
    var last=(GTFS&&GTFS.coverage&&GTFS.coverage.lastCovered)||
      allFeeds().reduce(function(m,f){return f.feedEnd>m?f.feedEnd:m},'');
    if(!last) return null;
    var t=utahToday(),today=dstr(t.y,t.m,t.d);
    if(last<today) return null;
    var days=dayGap(today,last);
    if(days>10) return null;
    return mkEl('div','notice notice--amber',
      [days===0
        ? 'Heads up — today is the last day with schedule data. UTA normally publishes the next timetable before it lapses.'
        : 'Heads up — schedule data runs out in '+days+' day'+(days===1?'':'s')+', through '+fmtDate(last)+'. UTA normally publishes the next timetable before then.']);
  }

  // Verification log. When a gap is covered here, the times shown for rail have
  // been checked departure-by-departure against the real schedule and found
  // identical, so the UI says so instead of warning the user off good data.
  // Verified 2026-08-09 against UTA's published Apr-2026 Green Line timetable,
  // UTA's Fall-2026 FrontRunner timetable, and Transitland's archived
  // Jun 21–Aug 15 feed: Green Line 73 weekday / 73 Saturday / 35 Sunday
  // departures at the Airport, FrontRunner 28 weekday / 18 Saturday / 0 Sunday
  // at Provo Central, all exact matches. Scoped to the dates actually checked —
  // a later gap gets the cautious wording until someone verifies it too.
  var VERIFIED_GAPS=[{from:'20260809',to:'20260815',sourceStart:'20260816'}];
  function gapVerified(ds,sourceStart){
    for(var i=0;i<VERIFIED_GAPS.length;i++){
      var v=VERIFIED_GAPS[i];
      // Both must match: the requested date AND the feed the estimate is
      // drawn from. Otherwise a stale embedded snapshot could wear the badge.
      if(v.from<=ds&&ds<=v.to&&v.sourceStart===sourceStart) return true;
    }
    return false;
  }

  function renderApproxBanner(res){
    var ok=gapVerified(res.requested||'',res.source&&res.source.feedStart);
    var box=mkEl('div','notice '+(ok?'notice--green':'notice--amber'));
    var shortText=ok
      ? '\u2713 Verified times \u00b7 '+fmtDate(res.source.feedStart)+' timetable'
      : 'Estimated times \u00b7 '+fmtDate(res.source.feedStart)+' timetable \u00b7 verify before relying on them';
    var longText=ok
      ? 'UTA has not republished this date, so these come from the '+fmtDate(res.source.feedStart)
        +' timetable. Checked departure-by-departure against UTA\u2019s published timetable and the '
        +'archived live feed for weekdays, Saturdays and Sundays: identical.'
        // Restore with the Adobe routes: +' Rail times are exact; Route 871 is withheld separately.'
      : 'UTA has not published a schedule for this date. These times come from the '
        +fmtDate(res.source.feedStart)+' timetable for the same weekday.';
    box.appendChild(txt(shortText));
    var more=mkEl('button','notice-link',['details']);
    var detail=mkEl('div','notice-detail',[longText]);
    var off=mkEl('button','notice-link',['Hide estimates']);
    off.addEventListener('click',function(){setApprox(false)});
    detail.appendChild(off);
    more.addEventListener('click',function(){
      var open=detail.classList.toggle('open');
      more.textContent=open?'less':'details';
    });
    box.appendChild(more);
    box.appendChild(detail);
    return box;
  }

  function renderHero(c,ctx){
    var L1=ctx.L1,L2=ctx.L2,dir=DIRECTIONS[DIRECTION];
    var total=Math.round(c.finalArr-c.leg1Dep);
    var xferBuf=Math.round(c.xferDep-c.xferArr);
    var card=mkEl('div','hero'+(ctx.animate?' row-enter':''));

    // Live delays for today's board (0 when no realtime data)
    var rt=null;
    if(ctx.isToday){
      var d1dep=delayMin(c.leg1Tid,dir.leg1.fromKey&&GTFS[dir.leg1.fromKey],'dep');
      var d1arr=delayMin(c.leg1Tid,GTFS[dir.leg1.toKey],'arr');
      var d2dep=delayMin(c.leg2Tid,GTFS[dir.leg2.fromKey],'dep');
      var d2arr=delayMin(c.leg2Tid,GTFS[dir.leg2.toKey],'arr');
      if(d1dep||d1arr||d2dep||d2arr) rt={d1dep:d1dep,d1arr:d1arr,d2dep:d2dep,d2arr:d2arr,
        slack:(c.xferDep+d2dep)-(c.xferArr+d1arr)};
    }

    var labelText,eyebrowCls='hero-eyebrow';
    if(MODE==='arrive'){
      var buffer=Math.round(ctx.targetMin-c.finalArr);
      labelText='Arrives '+buffer+' min before '+minToDisplay(ctx.targetMin);
    } else if(ctx.isToday){
      var effDep=c.leg1Dep+(rt?rt.d1dep:0);
      var inMin=Math.round(effDep-ctx.realNowMin);
      if(inMin<=0){labelText='Leaving now';eyebrowCls+=' hot';}
      else{labelText='Leave in '+inMin+' min';if(inMin<=10)eyebrowCls+=' hot';}
    } else {
      labelText='First departure';
      eyebrowCls+=' calm';
    }
    card.appendChild(mkEl('div',eyebrowCls,[labelText]));

    // "4:09" big, "PM" small
    function bigTime(mins){
      var parts=minToDisplay(mins).split(' ');
      var el=mkEl('span','sp-time',[parts[0]]);
      el.appendChild(mkEl('span','ap',[parts[1]]));
      return el;
    }

    // The journey drawn as a line diagram, each leg in its line's own color.
    var spine=mkEl('div','spine');
    spine.appendChild(mkEl('div','sp-node n-'+L1.color));
    var st1=mkEl('div','sp-station');
    st1.appendChild(bigTime(c.leg1Dep));
    if(rt&&rt.d1dep>=2) st1.appendChild(mkEl('span','delay-chip',['+'+rt.d1dep+' min']));
    st1.appendChild(mkEl('span','sp-name',[dir.origin]));
    spine.appendChild(st1);

    spine.appendChild(mkEl('div','sp-leg l-'+L1.color));
    var lm1=mkEl('div','sp-legmeta t-'+L1.color,[L1.label]);
    lm1.appendChild(mkEl('span','ride',[Math.round(c.leg1Ride)+' min']));
    spine.appendChild(lm1);

    spine.appendChild(mkEl('div','sp-node n-xfer'));
    var xf=mkEl('div','sp-xfer');
    xf.appendChild(mkEl('span','sp-xfer-time',[minToDisplay(c.xferArr)+' \u2192 '+minToDisplay(c.xferDep)]));
    xf.appendChild(mkEl('span','sp-name',[dir.transferName]));
    xf.appendChild(mkEl('span','sp-xfer-wait',['('+xferBuf+' min wait)']));
    spine.appendChild(xf);

    spine.appendChild(mkEl('div','sp-leg l-'+L2.color));
    var lm2=mkEl('div','sp-legmeta t-'+L2.color,[L2.label]);
    lm2.appendChild(mkEl('span','ride',[Math.round(c.leg2Ride)+' min']));
    spine.appendChild(lm2);

    spine.appendChild(mkEl('div','sp-node n-'+L2.color));
    var st2=mkEl('div','sp-station');
    st2.appendChild(bigTime(c.finalArr));
    if(rt&&rt.d2arr>=2) st2.appendChild(mkEl('span','delay-chip',['+'+rt.d2arr+' min']));
    st2.appendChild(mkEl('span','sp-name',[dir.dest]));
    spine.appendChild(st2);
    card.appendChild(spine);

    if(rt&&rt.slack<3){
      card.appendChild(mkEl('div','risk-note',
        ['\u26a0 Transfer at risk \u2014 '+L1.label+' running '+(rt.d1arr>0?'+'+rt.d1arr+' min':'late')+
         ', '+Math.max(0,Math.round(rt.slack))+' min to make the '+L2.label+'.']));
    }

    var foot=mkEl('div','hero-foot');
    foot.appendChild(mkEl('span','hero-total',[total+' min door to door']));
    var more=mkEl('button','hero-more',['Full schedule \u203a']);
    more.type='button';
    more.addEventListener('click',openSheet);
    // Earlier leg-1 options that also catch the same leg-2 train
    if(ctx.alts&&ctx.alts.length){
      var altTimes=ctx.alts.map(function(a){return minToDisplay(a.leg1Dep)}).join(', ');
      var alts=mkEl('span','hero-alts',['Same '+L2.label+' \u00b7 earlier '+L1.label+': ']);
      alts.appendChild(mkEl('b',null,[altTimes]));
      foot.appendChild(alts);
    }
    foot.appendChild(more);
    card.appendChild(foot);
    return card;
  }

  function renderNeighborRow(c,ctx,kind){
    var total=Math.round(c.finalArr-c.leg1Dep);
    var departed=ctx.isToday&&c.leg1Dep<ctx.realNowMin;
    var row=mkEl('button','row row-btn row--'+kind+(departed?' row--past':'')+(ctx.animate?' row-enter':''));
    row.type='button';
    row.setAttribute('aria-label','Show the full schedule for this day');
    row.addEventListener('click',openSheet);
    row.style.animationDelay='0.03s';
    row.appendChild(mkEl('span','r-kind',[departed?'Departed':(kind==='earlier'?'Earlier':'Later')]));
    row.appendChild(mkEl('span','r-dep',[minToDisplay(c.leg1Dep)]));
    row.appendChild(mkEl('span','r-arrow',['\u2192']));
    row.appendChild(mkEl('span','r-arr',[minToDisplay(c.finalArr)]));
    row.appendChild(mkEl('span','r-fill'));
    row.appendChild(mkEl('span','r-total',[total+'m']));
    if(ctx.isToday&&c.leg1Dep>=ctx.realNowMin){
      var inM=Math.round(c.leg1Dep-ctx.realNowMin);
      row.appendChild(mkEl('span','r-in',['in '+inM+'m']));
    }
    return row;
  }

  var lastRenderKey='';
  function render(y,m,d,h,mi){
    var dir=DIRECTIONS[DIRECTION];
    var L1=dir.leg1,L2=dir.leg2;
    var targetMin=h*60+mi;
    var t=utahToday();
    var isToday=(t.y===y&&t.m===m&&t.d===d);
    var realNowMin=t.h*60+t.mi;
    var connections=getConnections(y,m,d);
    var board=document.getElementById('board');
    clearEl(board);
    updateControlsPill();

    var cw=coverageWarning();
    if(cw) board.appendChild(cw);

    var res=resolveFeed(y,m,d);
    if(!res){
      var ds0=dstr(y,m,d),nx=nextCoveredDate(ds0);
      var gmsg='UTA has not published a schedule covering this date.';
      if(nx) gmsg+=' Timetables resume '+fmtDate(nx)+'.';
      // Unreachable while the Adobe routes are disabled above; restore with them.
      // if(APPROX_ON&&isAdobeRoute(DIRECTION))
      //   gmsg='Route 871’s timetable changes on '+fmtDate(nx||'')+
      //        ', so estimates would be wrong by a few minutes on an hourly bus. '+
      //        'Estimates stay off for this route — check the UTA app for today’s bus times.';
      board.appendChild(renderGap(gmsg,nx,APPROX_ON&&isAdobeRoute(DIRECTION)?null:nearestFeed(ds0)));
      return;
    }
    if(res.approx) board.appendChild(renderApproxBanner(res));

    if(connections.length===0){
      var dow=new Date(y,m-1,d).getDay();
      var msg=dow===0?'No FrontRunner service on Sundays.':'No connections found for this date.';
      var box0=renderEmpty(msg,'neutral');
      // Never leave a dead end: offer the next day's board.
      var nxt=mkEl('button','btn-ghost',[isToday?'See tomorrow\u2019s first train':'See the next day']);
      nxt.addEventListener('click',function(){
        FOLLOW_NOW=false;
        stepDate(1);
        writeTimeInput(4*60);
        update();
      });
      box0.appendChild(mkEl('div','gap-actions',[nxt]));
      board.appendChild(box0);
      return;
    }

    // Filter based on mode, then group by (xferDep, finalArr) keeping the
    // LATEST leg1Dep per group — minimizes wait at transfer, i.e. "leave as
    // late as possible while still catching this second-leg train".
    var filtered;
    if(MODE==='depart'){
      filtered=connections.filter(function(c){return c.leg1Dep>=targetMin});
    } else {
      filtered=connections.filter(function(c){return c.finalArr<=targetMin});
    }
    var byKey={};
    filtered.forEach(function(c){
      var k=c.xferDep+'|'+c.finalArr;
      if(!byKey[k]||byKey[k].leg1Dep<c.leg1Dep) byKey[k]=c;
    });
    filtered=Object.keys(byKey).map(function(k){return byKey[k]});
    if(MODE==='depart'){
      filtered.sort(function(a,b){return a.leg1Dep-b.leg1Dep});
    } else {
      filtered.sort(function(a,b){return (b.finalArr-a.finalArr)||(b.leg1Dep-a.leg1Dep)});
    }
    var primary=filtered.length?filtered[0]:null;

    if(!primary){
      var em;
      if(MODE==='arrive') em='No connection arrives by '+minToDisplay(targetMin)+'.';
      else if(isToday) em='No more trains today.';
      else em='No connections found for this date.';
      var box=renderEmpty(em,MODE==='arrive'?'warn':'neutral');
      if(MODE==='depart'&&isToday){
        var tmr=mkEl('button','btn-ghost',['See tomorrow\u2019s first train']);
        tmr.addEventListener('click',function(){
          FOLLOW_NOW=false;
          stepDate(1);
          writeTimeInput(4*60);
          update();
        });
        box.appendChild(mkEl('div','gap-actions',[tmr]));
      }
      board.appendChild(box);
      return;
    }

    // Alternative leg-1 options that catch the same leg-2 train as primary
    var alts=connections.filter(function(c){
      return c.xferDep===primary.xferDep&&c.finalArr===primary.finalArr&&c.leg1Dep!==primary.leg1Dep;
    }).sort(function(a,b){return a.leg1Dep-b.leg1Dep});

    var ctx={L1:L1,L2:L2,dir:dir,isToday:isToday,realNowMin:realNowMin,targetMin:targetMin,alts:alts};

    // Build de-duplicated full timeline for neighbor navigation — same rule
    // as primary selection (keep latest leg1Dep per FR group, sort asc).
    var fullByKey={};
    connections.forEach(function(c){
      var k=c.xferDep+'|'+c.finalArr;
      if(!fullByKey[k]||fullByKey[k].leg1Dep<c.leg1Dep) fullByKey[k]=c;
    });
    var fullDedup=Object.keys(fullByKey).map(function(k){return fullByKey[k]})
      .sort(function(a,b){return a.leg1Dep-b.leg1Dep});
    var pIdx=-1;
    for(var i=0;i<fullDedup.length;i++){
      if(fullDedup[i].xferDep===primary.xferDep&&fullDedup[i].finalArr===primary.finalArr){pIdx=i;break}
    }
    var earlier=pIdx>0?fullDedup[pIdx-1]:null;
    var later=pIdx>=0&&pIdx<fullDedup.length-1?fullDedup[pIdx+1]:null;

    // Re-animate only when the shown connection changes — the 30s clock tick
    // must not make the board flash while someone is glancing at it.
    var key=DIRECTION+'|'+MODE+'|'+dstr(y,m,d)+'|'+primary.leg1Dep+'|'+primary.xferDep+'|'+primary.finalArr;
    ctx.animate=key!==lastRenderKey;
    lastRenderKey=key;

    // Stash the whole day for the schedule sheet.
    SHEET_DATA={list:fullDedup,primary:primary,ctx:ctx,dateStr:updateControlsPillDateStr(y,m,d)};
    if(document.getElementById('sheetOverlay').classList.contains('open')) fillSheet();

    if(earlier) board.appendChild(renderNeighborRow(earlier,ctx,'earlier'));
    board.appendChild(renderHero(primary,ctx));
    if(later) board.appendChild(renderNeighborRow(later,ctx,'later'));

    // Pinned-tab glanceability: put the countdown in the title.
    if(isToday&&MODE==='depart'){
      var inT=Math.round(primary.leg1Dep-realNowMin);
      if(inT>=0&&inT<=180){
        document.title='in '+inT+'m \u00b7 '+minToDisplay(primary.leg1Dep)+' \u2192 '+dir.dest;
        return;
      }
    }
    document.title=dir.origin+' \u2192 '+dir.dest;
  }

  function restoreInputsIfFuture(){
    var sd=lsGet('transit.date');

    if(!sd||!st) return false;
    var dp=sd.split('-').map(Number);
    var tp=st.split(':').map(Number);
    if(dp.length!==3||tp.length!==2||dp.some(isNaN)||tp.some(isNaN)) return false;
    var now=utahToday();
    var nowKey=now.y*10000+now.m*100+now.d;
    var savedKey=dp[0]*10000+dp[1]*100+dp[2];
    var nowMin=now.h*60+now.mi;
    var savedMin=tp[0]*60+tp[1];
    if(savedKey<nowKey||(savedKey===nowKey&&savedMin<nowMin)) return false;
    document.getElementById('dateInput').value=sd;
    document.getElementById('timeInput').value=st;
    FOLLOW_NOW=false;
    return true;
  }

  // Freshness tracking
  function formatAge(isoTs){
    if(!isoTs)return'unknown age';
    var t=new Date(isoTs).getTime();
    if(isNaN(t))return'unknown age';
    var s=Math.max(0,Math.floor((Date.now()-t)/1000));
    if(s<60)return'just now';
    var m=Math.floor(s/60);
    if(m<60)return m+'m ago';
    var h=Math.floor(m/60);
    if(h<24)return h+'h '+(m%60)+'m ago';
    var d=Math.floor(h/24);
    return d+'d '+(h%24)+'h ago';
  }
  // Offline story, made visible:
  //   green dot  = everything this app needs is saved on this device
  //   amber dot  = offline right now, running on the saved schedule
  var OFFLINE_READY=false;
  function checkOfflineReady(){
    if(!('caches' in window)){OFFLINE_READY=!!lsGet(GTFS_CACHE_KEY);updateFreshnessLabel();return}
    Promise.all([
      caches.match('/index.html'),
      caches.match('/fonts/barlow-condensed-600.woff2')
    ]).then(function(r){
      var shell=!!(r[0]&&r[1]);
      var data=!!lsGet(GTFS_CACHE_KEY)||GTFS.stopTimes.length>0;  // embedded copy counts
      OFFLINE_READY=shell&&data&&!!navigator.serviceWorker.controller;
      updateFreshnessLabel();
    }).catch(function(){});
  }
  function isOffline(){return navigator.onLine===false||lastRefreshFailed}
  function updateFreshnessLabel(){
    var btn=document.getElementById('refreshBtn');
    var el=document.getElementById('freshness');
    var dot=document.getElementById('netDot');
    var t=GTFS.generatedAt?new Date(GTFS.generatedAt).getTime():0;
    var ageMs=t?Date.now()-t:Infinity;
    var age=formatAge(GTFS.generatedAt);
    if(isOffline()){
      el.textContent='offline \u00b7 saved schedule';
      dot.className='off';
      btn.classList.add('is-stale');
      btn.setAttribute('title','No connection \u2014 running on the schedule saved on this device ('+age+')');
    } else {
      el.textContent=age;
      dot.className=OFFLINE_READY?'ready':'';
      btn.classList.toggle('is-stale',ageMs>8*3600000);
      btn.setAttribute('title','Schedule updated '+age+
        (OFFLINE_READY?' \u00b7 saved for offline use':'')+' \u00b7 tap to refresh');
    }
  }

  // ---- Live delays (GTFS-realtime via /delays.json) ------------------------
  // {t: epochSec, trips: {tripId: {d: overallDelaySec, su: {stopId: [arrDelaySec, depDelaySec]}}}}
  var DELAYS={t:0,trips:{}};
  var delaysInflight=false;
  function fetchDelays(){
    if(delaysInflight) return;
    var t=utahToday(),inp=getInputs();
    if(!(inp.y===t.y&&inp.m===t.m&&inp.d===t.d)) return;   // realtime only matters today
    delaysInflight=true;
    fetch('/delays.json',{cache:'no-cache'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(d){
        if(d&&d.trips){DELAYS=d;update();}
      })
      .catch(function(e){console.warn('Delays fetch failed:',e)})
      .then(function(){delaysInflight=false});
  }
  // minutes of delay for a trip at the first matching stop, arr|dep
  function delayMin(tid,stops,kind){
    var tr=tid&&DELAYS.trips[tid];
    if(!tr) return 0;
    if(tr.su&&stops){
      for(var i=0;i<stops.length;i++){
        var s=tr.su[stops[i]];
        if(s){
          var v=kind==='arr'?s[0]:s[1];
          if(v==null) v=kind==='arr'?s[1]:s[0];
          if(v!=null) return Math.round(v/60);
        }
      }
    }
    return tr.d?Math.round(tr.d/60):0;
  }
  function fetchFreshGTFS(){
    if(refreshInflight)return Promise.resolve();
    refreshInflight=true;
    var icon=document.getElementById('refreshIcon');
    icon.classList.add('spin');
    var started=Date.now();
    return fetch('/gtfs_data.json',{cache:'no-cache'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(fresh){
        var oldT=GTFS.generatedAt?new Date(GTFS.generatedAt).getTime():0;
        var newT=fresh.generatedAt?new Date(fresh.generatedAt).getTime():0;
        if(newT>=oldT&&fresh.stopTimes){
          GTFS=fresh;
          cacheGTFS(fresh);
          updateFeedNote();
          update();
        }
        lastRefreshFailed=false;
        updateFreshnessLabel();
      })
      .catch(function(e){
        console.warn('Refresh failed:',e);
        lastRefreshFailed=true;
        updateFreshnessLabel();
      })
      .then(function(){
        var wait=Math.max(0,700-(Date.now()-started));
        setTimeout(function(){
          icon.classList.remove('spin');
          refreshInflight=false;
        },wait);
      });
  }

  // Time stepper
  function parseTimeInput(){
    var v=document.getElementById('timeInput').value;
    if(!v)return 0;
    var p=v.split(':').map(Number);
    return p[0]*60+p[1];
  }
  function writeTimeInput(mins){
    mins=Math.max(0,Math.min(1439,mins));
    var h=Math.floor(mins/60),mi=mins%60;
    document.getElementById('timeInput').value=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
    syncTimeDisplay();
  }
  function syncTimeDisplay(){
    document.getElementById('timeDisplay').textContent=minToDisplay(parseTimeInput());
  }
  function stepTime(delta){
    FOLLOW_NOW=false;
    var m=parseTimeInput();
    // Snap to 15-min grid
    var snapped=Math.round(m/15)*15;
    if(snapped===m) m=m+delta;
    else m=(delta>0?snapped+(snapped<=m?15:0):snapped-(snapped>=m?15:0));
    writeTimeInput(m);
    update();
  }
  function buildTimePopover(){
    var pop=document.getElementById('timePopover');
    clearEl(pop);
    var cur=parseTimeInput();
    var curSnap=Math.round(cur/15)*15;
    for(var m=0;m<=23*60+45;m+=15){
      (function(mm){
        var item=mkEl('button','pop-item'+(mm===curSnap?' is-current':''),[minToDisplay(mm)]);
        item.type='button';
        item.addEventListener('click',function(){
          FOLLOW_NOW=false;
          writeTimeInput(mm);
          closeTimePopover();
          update();
        });
        if(mm===curSnap) item.setAttribute('data-current','1');
        pop.appendChild(item);
      })(m);
    }
  }

    chev.style.transform=open?'rotate(90deg)':'rotate(0deg)';
  });

  setInterval(function(){
    var n=utahToday(),inp=getInputs();
    if(inp.y===n.y&&inp.m===n.m&&inp.d===n.d){
      // Only track the clock if the user hasn't picked their own time —
      // otherwise a planned "6:00 PM today" would silently snap back to now.
      if(MODE==='depart'&&FOLLOW_NOW){
        document.getElementById('timeInput').value=String(n.h).padStart(2,'0')+':'+String(n.mi).padStart(2,'0');
        syncTimeDisplay();
      }
      update();
    }
  },30000);

  if(!restoreInputsIfFuture()) setNow();
  syncTimeDisplay();
  updateHeader();
  updateModeButtons();
  updateFreshnessLabel();
  checkOfflineReady();
  setTimeout(checkOfflineReady,4000);   // again once the SW finishes installing
  setInterval(updateFreshnessLabel,30000);
  // Fetch fresh GTFS on load (background; swaps in if newer), and again
  // whenever the tab comes back to the foreground with stale-ish data.
  fetchFreshGTFS();
  fetchDelays();
  setInterval(function(){if(document.visibilityState==='visible')fetchDelays()},60000);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    fetchDelays();
    var t=GTFS.generatedAt?new Date(GTFS.generatedAt).getTime():0;
    if(!t||Date.now()-t>30*60000) fetchFreshGTFS();
  });
  function updateFeedNote(){
    var note=document.getElementById('feedNote');
    var t=utahToday(),today=dstr(t.y,t.m,t.d),seen={},parts=[];
    allFeeds().forEach(function(f){
      if(f.feedEnd<today) return;
      var k=f.feedStart+'-'+f.feedEnd;
      if(seen[k]) return;
      seen[k]=1;
      parts.push(fmtDate(f.feedStart)+' \u2013 '+fmtDate(f.feedEnd));
    });
    var txt=parts.length?'Valid '+parts.join(' \u00b7 ')+' \u00b7 UTA GTFS':'';
    if(OFFLINE_READY) txt+='\n\u2713 Offline ready \u2014 the app and the full schedule are saved on this device.';
    note.textContent=txt;
    note.style.whiteSpace='pre-line';
  }
  updateFeedNote();
  update();

  // Splash: a launch moment for the installed app. Never in a browser tab,
  // never on SW-triggered reloads, never for reduced-motion users.
  (function(){
    var el=document.getElementById('splash');
    if(!el) return;
    var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
    var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var seen=false;
    try{seen=sessionStorage.getItem('transit.splashed')==='1'}catch(e){}
    if(!standalone||reduced||seen){el.remove();return}
    try{sessionStorage.setItem('transit.splashed','1')}catch(e){}
    el.classList.add('on','done');
    setTimeout(function(){el.remove()},1300);
  })();

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('/sw.js').then(function(reg){
        // This app lives in a pinned tab for days. A tab left open across a
        // deploy keeps running its original JavaScript forever — the data
        // refreshes but the code never does, which is how a fixed bug can
        // still be on screen hours later. Check for a new version on load and
        // every time the tab is brought back to the foreground.
        function checkForUpdate(){ try{ reg.update() }catch(e){} }
        checkForUpdate();
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible') checkForUpdate();
        });
        reg.addEventListener('updatefound',function(){
          var incoming=reg.installing;
          if(!incoming) return;
          incoming.addEventListener('statechange',function(){
            // controller present => this is an update, not a first install,
            // so reloading swaps the user onto the new code immediately.
            if(incoming.state==='installed'&&navigator.serviceWorker.controller){
              // Guard against reload loops if an update keeps re-firing.
              var last=Number(sessionStorage.getItem('transit.swReload')||0);
              if(Date.now()-last>10*60000){
                try{sessionStorage.setItem('transit.swReload',String(Date.now()))}catch(e){}
                location.reload();
              }
            }
          });
        });
      }).catch(function(e){
        console.warn('Service worker registration failed:',e);
      });
    });
  }
})();
</script>
</body>
</html>
