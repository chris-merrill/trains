    var res=resolveFeed(y,m,d);
    if(!res){
      var ds0=dstr(y,m,d),nx=nextCoveredDate(ds0);
      var gmsg='UTA has not published a schedule covering this date.';
      if(nx) gmsg+=' Timetables resume '+fmtDate(nx)+'.';
      board.appendChild(renderGap(gmsg,nx,nearestFeed(ds0)));
      return;
    }
    if(res.approx) board.appendChild(renderApproxBanner(res));

    if(connections.length===0){
      var dow=new Date(y,m-1,d).getDay();
      var msg=dow===0?'No FrontRunner service on Sundays.':'No connections found for this date.';
      board.appendChild(renderEmpty(msg,'neutral'));
      return;
    }

    // Filter based on mode, then group by (xferDep, finalArr) keeping the
    // LATEST leg1Dep per group — minimizes wait at transfer, i.e. "leave as
    // late as possible while still catching this second-leg train".
    var filtered;
    if(MODE==='depart'){
      filtered=connections.filter(function(c){return c.leg1Dep>=targetMin});
    } else {
      filtered=connections.filter(function(c){return c.finalArr<=targetMin});
    }
    var byKey={};
    filtered.forEach(function(c){
      var k=c.xferDep+'|'+c.finalArr;
      if(!byKey[k]||byKey[k].leg1Dep<c.leg1Dep) byKey[k]=c;
    });
    filtered=Object.keys(byKey).map(function(k){return byKey[k]});
    if(MODE==='depart'){
      filtered.sort(function(a,b){return a.leg1Dep-b.leg1Dep});
    } else {
      filtered.sort(function(a,b){return (b.finalArr-a.finalArr)||(b.leg1Dep-a.leg1Dep)});
    }
    var primary=filtered.length?filtered[0]:null;

    if(!primary){
      var em;
      if(MODE==='arrive') em='No connection arrives by '+minToDisplay(targetMin)+'.';
      else if(isToday) em='No more trains today.';
      else em='No connections found for this date.';
      board.appendChild(renderEmpty(em,MODE==='arrive'?'warn':'neutral'));
      return;
    }

    // Alternative leg-1 options that catch the same leg-2 train as primary
    var alts=connections.filter(function(c){
      return c.xferDep===primary.xferDep&&c.finalArr===primary.finalArr&&c.leg1Dep!==primary.leg1Dep;
    }).sort(function(a,b){return a.leg1Dep-b.leg1Dep});

    var ctx={L1:L1,L2:L2,dir:dir,isToday:isToday,realNowMin:realNowMin,targetMin:targetMin,alts:alts};

    // Build de-duplicated full timeline for neighbor navigation — same rule
    // as primary selection (keep latest leg1Dep per FR group, sort asc).
    var fullByKey={};
    connections.forEach(function(c){
      var k=c.xferDep+'|'+c.finalArr;
      if(!fullByKey[k]||fullByKey[k].leg1Dep<c.leg1Dep) fullByKey[k]=c;
    });
    var fullDedup=Object.keys(fullByKey).map(function(k){return fullByKey[k]})
      .sort(function(a,b){return a.leg1Dep-b.leg1Dep});
    var pIdx=-1;
    for(var i=0;i<fullDedup.length;i++){
      if(fullDedup[i].xferDep===primary.xferDep&&fullDedup[i].finalArr===primary.finalArr){pIdx=i;break}
    }
    var earlier=pIdx>0?fullDedup[pIdx-1]:null;
    var later=pIdx>=0&&pIdx<fullDedup.length-1?fullDedup[pIdx+1]:null;

    if(earlier) board.appendChild(renderNeighborRow(earlier,ctx,'earlier'));
    board.appendChild(renderHero(primary,ctx));
    if(later) board.appendChild(renderNeighborRow(later,ctx,'later'));
  }

  function setNow(){
    var n=utahToday();
    document.getElementById('dateInput').value=n.y+'-'+String(n.m).padStart(2,'0')+'-'+String(n.d).padStart(2,'0');
    document.getElementById('timeInput').value=String(n.h).padStart(2,'0')+':'+String(n.mi).padStart(2,'0');
  }
  function saveInputs(){
    try{
      localStorage.setItem('transit.date',document.getElementById('dateInput').value);
      localStorage.setItem('transit.time',document.getElementById('timeInput').value);
    }catch(e){}
  }
  function restoreInputsIfFuture(){
    var sd=localStorage.getItem('transit.date');
    var st=localStorage.getItem('transit.time');
    if(!sd||!st) return false;
    var dp=sd.split('-').map(Number);
    var tp=st.split(':').map(Number);
    if(dp.length!==3||tp.length!==2||dp.some(isNaN)||tp.some(isNaN)) return false;
    var now=utahToday();
    var nowKey=now.y*10000+now.m*100+now.d;
    var savedKey=dp[0]*10000+dp[1]*100+dp[2];
    var nowMin=now.h*60+now.mi;
    var savedMin=tp[0]*60+tp[1];
    if(savedKey<nowKey||(savedKey===nowKey&&savedMin<nowMin)) return false;
    document.getElementById('dateInput').value=sd;
    document.getElementById('timeInput').value=st;
    return true;
  }
  function getInputs(){
    var dv=document.getElementById('dateInput').value.split('-').map(Number);
    var tv=document.getElementById('timeInput').value.split(':').map(Number);
    return{y:dv[0],m:dv[1],d:dv[2],h:tv[0],mi:tv[1]};
  }
  function update(){
    saveInputs();
    updateWeekendHint();
    var inp=getInputs();
    render(inp.y,inp.m,inp.d,inp.h,inp.mi);
  }

  // Freshness tracking
  function formatAge(isoTs){
    if(!isoTs)return'unknown age';
    var t=new Date(isoTs).getTime();
    if(isNaN(t))return'unknown age';
    var s=Math.max(0,Math.floor((Date.now()-t)/1000));
    if(s<60)return'just now';
    var m=Math.floor(s/60);
    if(m<60)return m+'m ago';
    var h=Math.floor(m/60);
    if(h<24)return h+'h '+(m%60)+'m ago';
    var d=Math.floor(h/24);
    return d+'d '+(h%24)+'h ago';
  }
  function updateFreshnessLabel(){
    var btn=document.getElementById('refreshBtn');
    var el=document.getElementById('freshness');
    var t=GTFS.generatedAt?new Date(GTFS.generatedAt).getTime():0;
    var ageMs=t?Date.now()-t:Infinity;
    var age=formatAge(GTFS.generatedAt);
    el.textContent=age;
    var stale=ageMs>8*3600000;
    btn.className='flex items-center gap-1 text-[11px] italic transition-colors shrink-0 px-1.5 py-1 -mr-1.5 active:scale-95 '+(stale?'text-amber-400 hover:text-amber-300':'text-gray-600 hover:text-gray-300');
    btn.setAttribute('title','Schedule updated '+age+' · tap to refresh');
  }
  var refreshInflight=false;
  function fetchFreshGTFS(){
    if(refreshInflight)return Promise.resolve();
    refreshInflight=true;
    var icon=document.getElementById('refreshIcon');
    icon.classList.add('animate-spin');
    var started=Date.now();
    return fetch('/gtfs_data.json?t='+Date.now(),{cache:'no-cache'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(fresh){
        var oldT=GTFS.generatedAt?new Date(GTFS.generatedAt).getTime():0;
        var newT=fresh.generatedAt?new Date(fresh.generatedAt).getTime():0;
        if(newT>=oldT&&fresh.stopTimes){
          GTFS=fresh;
          updateFeedNote();
          update();
        }
        updateFreshnessLabel();
      })
      .catch(function(e){console.warn('Refresh failed:',e)})
      .then(function(){
        var wait=Math.max(0,700-(Date.now()-started));
        setTimeout(function(){
          icon.classList.remove('animate-spin');
          refreshInflight=false;
        },wait);
      });
  }
  document.getElementById('refreshBtn').addEventListener('click',fetchFreshGTFS);

  function updateModeButtons(){
    var activeCls='px-2.5 py-1 text-xs font-mono font-medium rounded-md transition-colors bg-surface-900 text-white shadow-sm';
    var inactiveCls='px-2.5 py-1 text-xs font-mono font-medium rounded-md transition-colors text-gray-500 hover:text-gray-300';
    var depBtn=document.getElementById('modeDepartBtn');
    var arrBtn=document.getElementById('modeArriveBtn');
    depBtn.className=MODE==='depart'?activeCls:inactiveCls;
    arrBtn.className=MODE==='arrive'?activeCls:inactiveCls;
    depBtn.setAttribute('aria-selected',MODE==='depart');
    arrBtn.setAttribute('aria-selected',MODE==='arrive');
  }
  function setMode(m){
    if(m===MODE)return;
    MODE=m;
    localStorage.setItem('transit.mode',MODE);
    updateModeButtons();
    update();
  }
  document.getElementById('modeDepartBtn').addEventListener('click',function(){setMode('depart')});
  document.getElementById('modeArriveBtn').addEventListener('click',function(){setMode('arrive')});

  function updateHeader(){
    var dir=DIRECTIONS[DIRECTION];
    document.getElementById('originName').textContent=dir.origin;
    document.getElementById('destName').textContent=dir.dest;
    document.getElementById('leg1Badge').textContent=dir.leg1.label;
    document.getElementById('leg1Badge').className='px-1.5 py-0.5 rounded bg-'+dir.leg1.color+'/20 text-'+dir.leg1.color+' font-mono font-medium text-[11px]';
    document.getElementById('leg2Badge').textContent=dir.leg2.label;
    document.getElementById('leg2Badge').className='px-1.5 py-0.5 rounded bg-'+dir.leg2.color+'/20 text-'+dir.leg2.color+' font-mono font-medium text-[11px]';
    document.getElementById('headerBar').className='h-8 w-1 rounded-full bg-gradient-to-b from-'+dir.leg1.color+' to-'+dir.leg2.color+' shrink-0';
    document.getElementById('transferLabel').textContent=dir.transferName;
    updateWeekendHint();
    // Arrow always points right — text order already conveys direction
    document.title=dir.origin+' \u2192 '+dir.dest;
  }
  function isAdobeRoute(k){return k==='provoToAdobe'||k==='adobeToProvo';}
  function updateWeekendHint(){
    var hint=document.getElementById('weekendHint');
    if(!hint) return;
    var di=document.getElementById('dateInput').value;
    if(!isAdobeRoute(DIRECTION)||!di){hint.classList.add('hidden');return;}
    var p=di.split('-').map(Number);
    if(p.length!==3){hint.classList.add('hidden');return;}
    var dow=new Date(p[0],p[1]-1,p[2]).getDay();
    if(dow===0||dow===6) hint.classList.remove('hidden'); else hint.classList.add('hidden');
  }

  var ROUTE_ORDER=['airportToProvo','provoToAirport','provoToAdobe','adobeToProvo'];
  var SVG_NS='http://www.w3.org/2000/svg';
  function makeCheckIcon(){
    var svg=document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('class','h-4 w-4 text-trax shrink-0');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','2.5');
    svg.setAttribute('stroke-linecap','round');
    svg.setAttribute('stroke-linejoin','round');
    var path=document.createElementNS(SVG_NS,'path');
    path.setAttribute('d','M5 12l5 5L20 7');
    svg.appendChild(path);
    return svg;
  }
  function renderRouteMenu(){
    var menu=document.getElementById('routeMenu');
    while(menu.firstChild) menu.removeChild(menu.firstChild);
    ROUTE_ORDER.forEach(function(k){
      var d=DIRECTIONS[k];
      var selected=k===DIRECTION;
      var li=document.createElement('li');
      var btn=document.createElement('button');
      btn.type='button';
      btn.setAttribute('role','option');
      btn.setAttribute('data-route',k);
      btn.setAttribute('aria-selected',selected?'true':'false');
      btn.className='w-full text-left px-3.5 py-2.5 text-sm font-medium flex items-center gap-2 transition-colors '+
        (selected?'bg-surface-800 text-white':'text-gray-300 hover:bg-surface-800/70 hover:text-white');
      var swatch=document.createElement('span');
      swatch.className='h-4 w-0.5 rounded-full bg-gradient-to-b from-'+d.leg1.color+' to-'+d.leg2.color+' shrink-0';
      var label=document.createElement('span');
      label.className='flex-1 truncate';
      label.textContent=d.origin+' → '+d.dest;
      btn.appendChild(swatch);
      btn.appendChild(label);
      if(selected) btn.appendChild(makeCheckIcon());
      btn.addEventListener('click',function(){
        closeRouteMenu();
        if(k===DIRECTION) return;
        DIRECTION=k;
        localStorage.setItem('transit.route',DIRECTION);
        updateHeader();
        update();
      });
      li.appendChild(btn);
      menu.appendChild(li);
    });
  }
  function openRouteMenu(){
    renderRouteMenu();
    document.getElementById('routeMenu').classList.remove('hidden');
    document.getElementById('routeBtn').setAttribute('aria-expanded','true');
    document.getElementById('routeChevron').style.transform='rotate(180deg)';
  }
  function closeRouteMenu(){
    document.getElementById('routeMenu').classList.add('hidden');
    document.getElementById('routeBtn').setAttribute('aria-expanded','false');
    document.getElementById('routeChevron').style.transform='rotate(0deg)';
  }
  document.getElementById('routeBtn').addEventListener('click',function(e){
    e.stopPropagation();
    var hidden=document.getElementById('routeMenu').classList.contains('hidden');
    if(hidden) openRouteMenu(); else closeRouteMenu();
  });
  document.addEventListener('click',function(e){
    var menu=document.getElementById('routeMenu');
    if(menu.classList.contains('hidden')) return;
    if(!menu.contains(e.target)&&!document.getElementById('routeBtn').contains(e.target)) closeRouteMenu();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closeRouteMenu();
  });

  // Time stepper
  function parseTimeInput(){
    var v=document.getElementById('timeInput').value;
    if(!v)return 0;
    var p=v.split(':').map(Number);
    return p[0]*60+p[1];
  }
  function writeTimeInput(mins){
    mins=Math.max(0,Math.min(1439,mins));
    var h=Math.floor(mins/60),mi=mins%60;
    document.getElementById('timeInput').value=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
    syncTimeDisplay();
  }
  function syncTimeDisplay(){
    document.getElementById('timeDisplay').textContent=minToDisplay(parseTimeInput());
  }
  function stepTime(delta){
    var m=parseTimeInput();
    // Snap to 15-min grid
    var snapped=Math.round(m/15)*15;
    if(snapped===m) m=m+delta;
    else m=(delta>0?snapped+(snapped<=m?15:0):snapped-(snapped>=m?15:0));
    writeTimeInput(m);
    update();
  }
  function buildTimePopover(){
    var pop=document.getElementById('timePopover');
    clearEl(pop);
    var cur=parseTimeInput();
    var curSnap=Math.round(cur/15)*15;
    for(var m=4*60;m<=23*60+45;m+=15){
      (function(mm){
        var item=mkEl('button','block w-full text-left px-3 py-1.5 text-sm font-mono transition-colors '+(mm===curSnap?'bg-surface-900 text-white':'text-gray-400 hover:bg-surface-900/60 hover:text-white'),[minToDisplay(mm)]);
        item.type='button';
        item.addEventListener('click',function(){
          writeTimeInput(mm);
          closeTimePopover();
          update();
        });
        if(mm===curSnap) item.setAttribute('data-current','1');
        pop.appendChild(item);
      })(m);
    }
  }
  function openTimePopover(){
    buildTimePopover();
    var pop=document.getElementById('timePopover');
    pop.classList.remove('hidden');
    var cur=pop.querySelector('[data-current]');
    if(cur) cur.scrollIntoView({block:'center'});
    setTimeout(function(){document.addEventListener('click',outsideClickClose)},0);
  }
  function closeTimePopover(){
    document.getElementById('timePopover').classList.add('hidden');
    document.removeEventListener('click',outsideClickClose);
  }
  function outsideClickClose(e){
    if(!e.target.closest('#timePopover')&&!e.target.closest('#timeDisplay')) closeTimePopover();
  }
  document.getElementById('timePrev').addEventListener('click',function(){stepTime(-15)});
  document.getElementById('timeNext').addEventListener('click',function(){stepTime(15)});
  document.getElementById('timeDisplay').addEventListener('click',function(){
    var pop=document.getElementById('timePopover');
    if(pop.classList.contains('hidden')) openTimePopover(); else closeTimePopover();
  });

  document.getElementById('nowBtn').addEventListener('click',function(){setNow();syncTimeDisplay();update()});
  document.getElementById('dateInput').addEventListener('change',update);

  function stepDate(delta){
    var v=document.getElementById('dateInput').value;
    if(!v)return;
    var p=v.split('-').map(Number);
    var d=new Date(p[0],p[1]-1,p[2]);
    d.setDate(d.getDate()+delta);
    document.getElementById('dateInput').value=
      d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    update();
  }
  document.getElementById('datePrev').addEventListener('click',function(){stepDate(-1)});
  document.getElementById('dateNext').addEventListener('click',function(){stepDate(1)});

  // Controls pill disclosure
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function updateControlsPill(){
    var inp=getInputs();
    var today=utahToday();
    var isToday=inp.y===today.y&&inp.m===today.m&&inp.d===today.d;
    var verb=MODE==='depart'?'Depart':'Arrive by';
    var dateStr;
    if(isToday) dateStr='today';
    else {
      var dd=new Date(inp.y,inp.m-1,inp.d);
      dateStr=WEEKDAYS[dd.getDay()]+' '+MONTHS[inp.m-1]+' '+inp.d;
    }
    var timeStr=minToDisplay(inp.h*60+inp.mi);
    document.getElementById('controlsSummary').textContent=verb+' \u00b7 '+dateStr+' \u00b7 '+timeStr;
  }
  document.getElementById('controlsPill').addEventListener('click',function(){
    var drawer=document.getElementById('controlsDrawer');
    var chevron=document.getElementById('controlsChevron');
    var pill=document.getElementById('controlsPill');
    var open=drawer.classList.toggle('hidden')===false;
    pill.setAttribute('aria-expanded',open?'true':'false');
    chevron.style.transform=open?'rotate(180deg)':'rotate(0deg)';
  });

  // Feed note disclosure
  document.getElementById('feedNoteToggle').addEventListener('click',function(){
    var note=document.getElementById('feedNote');
    var chev=document.getElementById('feedNoteChevron');
    var btn=document.getElementById('feedNoteToggle');
    var open=note.classList.toggle('hidden')===false;
    btn.setAttribute('aria-expanded',open?'true':'false');
    chev.style.transform=open?'rotate(90deg)':'rotate(0deg)';
  });

  setInterval(function(){
    var n=utahToday(),inp=getInputs();
    if(inp.y===n.y&&inp.m===n.m&&inp.d===n.d){
      if(MODE==='depart'){
        document.getElementById('timeInput').value=String(n.h).padStart(2,'0')+':'+String(n.mi).padStart(2,'0');
        syncTimeDisplay();
      }
      update();
    }
  },30000);

  if(!restoreInputsIfFuture()) setNow();
  syncTimeDisplay();
  updateHeader();
  updateModeButtons();
  updateFreshnessLabel();
  setInterval(updateFreshnessLabel,30000);
  // Fetch fresh GTFS on load (background; swaps in if newer)
  fetchFreshGTFS();
  function updateFeedNote(){
    var note=document.getElementById('feedNote');
    var t=utahToday(),today=dstr(t.y,t.m,t.d),seen={},parts=[];
    allFeeds().forEach(function(f){
      if(f.feedEnd<today) return;
      var k=f.feedStart+'-'+f.feedEnd;
      if(seen[k]) return;
      seen[k]=1;
      parts.push(fmtDate(f.feedStart)+' \u2013 '+fmtDate(f.feedEnd));
    });
    note.textContent=parts.length?'Valid '+parts.join(' \u00b7 ')+' \u00b7 UTA GTFS':'';
  }
  updateFeedNote();
  update();
})();
</script>
</body>
