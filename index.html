    });
    legs.sort(function(a,b){return a.dep-b.dep});
    return legs;
  }

  function getConnections(y,m,d,dirKey){
    var dir=DIRECTIONS[dirKey||DIRECTION];
    var feed=pickFeed(y,m,d);
    var services=getActiveServices(y,m,d,feed);
    var stByTrip={};
    feed.stopTimes.forEach(function(st){
      if(!stByTrip[st[0]]) stByTrip[st[0]]=[];
      stByTrip[st[0]].push(st);
    });

    var legs1=buildLegs(services,stByTrip,dir.leg1.tripsKey,dir.leg1.fromKey,dir.leg1.toKey,feed);
    var legs2=buildLegs(services,stByTrip,dir.leg2.tripsKey,dir.leg2.fromKey,dir.leg2.toKey,feed);

    // Pair with 5-min walk/transfer buffer
    var connections=[];
    legs1.forEach(function(l1){
      var l2=legs2.find(function(f){return f.dep>=l1.arr+5});
      if(l2) connections.push({
        leg1Dep:l1.dep,xferArr:l1.arr,leg1Ride:l1.ride,
        xferDep:l2.dep,wait:Math.round(l2.dep-l1.arr),
        finalArr:l2.arr,leg2Ride:l2.ride
      });
    });
    connections.sort(function(a,b){return a.leg1Dep-b.leg1Dep});
    var seen=new Set(),unique=[];
    connections.forEach(function(c){
      var k=c.leg1Dep+'|'+c.xferDep;
      if(!seen.has(k)){seen.add(k);unique.push(c)}
    });
    return unique;
  }

  // DOM helpers
  function clearEl(el){while(el.firstChild)el.removeChild(el.firstChild)}
  function txt(s){return document.createTextNode(s)}
  function mkEl(tag,cls,children){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(children){
      (Array.isArray(children)?children:[children]).forEach(function(c){
        if(typeof c==='string')e.appendChild(txt(c));
        else if(c)e.appendChild(c);
      });
    }
    return e;
  }

  function render(y,m,d,h,mi){
    var dir=DIRECTIONS[DIRECTION];
    var L1=dir.leg1,L2=dir.leg2;
    var targetMin=h*60+mi;
    var t=utahToday();
    var isToday=(t.y===y&&t.m===m&&t.d===d);
    var realNowMin=t.h*60+t.mi;
    var connections=getConnections(y,m,d);
    var board=document.getElementById('board');
    var status=document.getElementById('status');
    clearEl(board);clearEl(status);

    if(connections.length===0){
      var dow=new Date(y,m-1,d).getDay();
      var msg=dow===0?'No FrontRunner service on Sundays.':'No connections found for this date.';
      status.className='mb-4 px-4 py-3 rounded-xl bg-surface-800/50 border border-gray-800/50 text-sm font-mono text-amber-400/80';
      status.appendChild(txt(msg));
      board.appendChild(mkEl('div','text-center py-12 text-gray-600 text-sm',[msg]));
      return;
    }

    // Filter/sort based on mode
    var filtered;
    if(MODE==='depart'){
      filtered=connections.filter(function(c){return !(isToday&&c.leg1Dep<targetMin)});
    } else {
      filtered=connections.filter(function(c){return c.finalArr<=targetMin});
      filtered.sort(function(a,b){return (b.finalArr-a.finalArr)||(b.leg1Dep-a.leg1Dep)});
    }
    var primary=filtered.length?filtered[0]:null;

    // Status message
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if(MODE==='arrive'){
      if(!primary){
        status.className='mb-4 px-4 py-3 rounded-xl bg-surface-800/50 border border-gray-800/50 text-sm font-mono text-amber-400/80';
        status.appendChild(txt('No connection arrives by '+minToDisplay(targetMin)+'.'));
      } else {
        var buffer=Math.round(targetMin-primary.finalArr);
        status.className='mb-4 px-4 py-3 rounded-xl bg-'+L1.color+'/5 border border-'+L1.color+'/20 text-sm font-mono text-'+L1.color;
        var line=mkEl('div','flex flex-wrap items-center gap-x-2 gap-y-1');
        line.appendChild(mkEl('span','font-semibold',['Latest: '+L1.label+' '+minToDisplay(primary.leg1Dep)]));
        line.appendChild(mkEl('span','text-gray-600',['\u2192']));
        line.appendChild(mkEl('span','text-white font-semibold',['arrive '+minToDisplay(primary.finalArr)]));
        line.appendChild(mkEl('span','text-gray-500',['('+buffer+' min before '+minToDisplay(targetMin)+')']));
        status.appendChild(line);
      }
    } else if(isToday&&primary){
      var inMin=Math.round(primary.leg1Dep-realNowMin);
      status.className='mb-4 px-4 py-3 rounded-xl bg-'+L1.color+'/5 border border-'+L1.color+'/20 text-sm font-mono text-'+L1.color;
      var statusLine=mkEl('div','flex flex-wrap items-center gap-x-2 gap-y-1');
      statusLine.appendChild(mkEl('span','font-semibold',['Next '+L1.label+' in '+inMin+' min']));
      statusLine.appendChild(mkEl('span','text-gray-600',['\u2192']));
      statusLine.appendChild(mkEl('span','text-gray-400',[L2.label+' at '+minToDisplay(primary.xferDep)]));
      statusLine.appendChild(mkEl('span','text-gray-600',['\u2192']));
      statusLine.appendChild(mkEl('span','text-white font-semibold',[L2.destName+' '+minToDisplay(primary.finalArr)]));
      status.appendChild(statusLine);
    } else if(isToday){
      status.className='mb-4 px-4 py-3 rounded-xl bg-surface-800/50 border border-gray-800/50 text-sm font-mono text-gray-500';
      status.appendChild(txt('No more trains today.'));
    } else {
      status.className='mb-4 px-4 py-3 rounded-xl bg-surface-800/50 border border-gray-800/50 text-sm font-mono text-gray-400';
      status.appendChild(txt('Schedule for '+months[m-1]+' '+d+' from '+minToDisplay(targetMin)));
    }

    // Group connections by second-leg departure
    var groups=[];
    filtered.forEach(function(conn){
      var last=groups[groups.length-1];
      if(last&&last.xferDep===conn.xferDep&&last.finalArr===conn.finalArr){
        last.options.push({leg1Dep:conn.leg1Dep,xferArr:conn.xferArr,leg1Ride:conn.leg1Ride,wait:conn.wait});
      } else {
        groups.push({
          xferDep:conn.xferDep,finalArr:conn.finalArr,leg2Ride:conn.leg2Ride,
          options:[{leg1Dep:conn.leg1Dep,xferArr:conn.xferArr,leg1Ride:conn.leg1Ride,wait:conn.wait}]
        });
      }
    });

    var container=mkEl('div','flex flex-col gap-3');
    var isFirstGroup=true;
    groups.forEach(function(group,gi){
      // Determine if this group contains the primary connection
      var hasNext=false;
      var hasSoon=false;
      group.options.forEach(function(opt){
        if(primary&&opt.leg1Dep===primary.leg1Dep&&group.xferDep===primary.xferDep) hasNext=true;
        else if(isToday&&opt.leg1Dep>=realNowMin&&(opt.leg1Dep-realNowMin)<=15) hasSoon=true;
      });
      if(isFirstGroup&&!primary) hasNext=true;

      var cardCls='rounded-xl border p-4 row-enter ';
      if(hasNext) cardCls+='bg-'+L1.color+'/[0.04] border-'+L1.color+'/20';
      else if(hasSoon) cardCls+='bg-amber/[0.03] border-amber-500/15';
      else cardCls+='bg-surface-800/40 border-gray-800/50';

      var card=mkEl('div',cardCls);
      card.style.animationDelay=(gi*0.05)+'s';

      // Step layout with timeline connector
      var steps=mkEl('div','flex gap-3');

      // Timeline bar (left side)
      var timeline=mkEl('div','flex flex-col items-center pt-1');
      timeline.appendChild(mkEl('div','w-2.5 h-2.5 rounded-full border-2 '+(hasNext?'border-'+L1.color+' bg-'+L1.color+'/30':'border-gray-600 bg-gray-800')));
      timeline.appendChild(mkEl('div','w-px flex-1 '+(hasNext?'bg-gradient-to-b from-'+L1.color+'/40 to-'+L2.color+'/40':'bg-gray-700/50')));
      timeline.appendChild(mkEl('div','w-2.5 h-2.5 rounded-full border-2 '+(hasNext?'border-'+L2.color+' bg-'+L2.color+'/30':'border-gray-600 bg-gray-800')));
      steps.appendChild(timeline);

      // Content (right side)
      var content=mkEl('div','flex-1 min-w-0');

      // Step 1: leg 1 departures
      var step1=mkEl('div','mb-3 rounded-lg bg-'+L1.color+'/[0.06] border border-'+L1.color+'/10 p-3');
      var s1Header=mkEl('div','flex items-center gap-2 mb-1.5');
      s1Header.appendChild(mkEl('span','px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold bg-'+L1.color+'/20 text-'+L1.color,[L1.label]));
      s1Header.appendChild(mkEl('span','text-[11px] text-gray-500',['from '+L1.fromName]));
      step1.appendChild(s1Header);

      var optGrid=mkEl('div','flex flex-wrap gap-2');
      group.options.forEach(function(opt){
        var isOptNext=primary&&opt.leg1Dep===primary.leg1Dep&&group.xferDep===primary.xferDep;
        var isOptSoon=isToday&&!isOptNext&&opt.leg1Dep>=realNowMin&&(opt.leg1Dep-realNowMin<=15);

        var pillCls='flex items-center gap-2 px-2.5 py-1 rounded-lg text-sm font-mono ';
        if(isOptNext) pillCls+='bg-'+L1.color+'/10 border border-'+L1.color+'/30';
        else if(isOptSoon) pillCls+='bg-amber/10 border border-amber-500/20';
        else pillCls+='bg-surface-900/50 border border-gray-800/50';

        var pill=mkEl('div',pillCls);
        if(isOptNext){
          pill.appendChild(mkEl('span','w-1.5 h-1.5 rounded-full bg-'+L1.color+' animate-pulse-soft'));
        }
        pill.appendChild(mkEl('span','font-bold '+(isOptNext?'text-'+L1.color:isOptSoon?'text-amber':'text-gray-300'),[minToDisplay(opt.leg1Dep)]));
        pill.appendChild(mkEl('span','text-[11px] text-gray-600',['\u2192']));
        pill.appendChild(mkEl('span','text-[11px] '+(isOptNext?'text-'+L1.color+'/70':isOptSoon?'text-amber/70':'text-gray-500'),[minToDisplay(opt.xferArr)]));

        var inMinVal=isToday&&opt.leg1Dep>=realNowMin?Math.round(opt.leg1Dep-realNowMin):-1;
        if(inMinVal>=0){
          pill.appendChild(mkEl('span','text-[11px] '+(isOptNext?'text-'+L1.color+'/60':isOptSoon?'text-amber/60':'text-gray-600'),['in '+inMinVal+'m']));
        }
        optGrid.appendChild(pill);
      });
      step1.appendChild(optGrid);
      content.appendChild(step1);

      // Transfer note
      var xfer=mkEl('div','text-[11px] font-mono text-gray-600 mb-3 pl-1');
      xfer.appendChild(txt('Transfer at N. Temple \u00b7 ~'+group.options[0].leg1Ride+' min ride'));
      content.appendChild(xfer);

      // Step 2: leg 2 to destination
      var step2=mkEl('div','rounded-lg bg-'+L2.color+'/[0.06] border border-'+L2.color+'/10 p-3');
      var s2Row=mkEl('div','flex items-center justify-between');
      var s2Left=mkEl('div','flex items-center gap-2');
      s2Left.appendChild(mkEl('span','px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold bg-'+L2.color+'/20 text-'+L2.color,[L2.label]));
      s2Left.appendChild(mkEl('span','font-mono font-bold '+(hasNext?'text-'+L2.color:'text-gray-200'),[minToDisplay(group.xferDep)]));
      s2Left.appendChild(mkEl('span','text-gray-600',['\u2192']));
      s2Left.appendChild(mkEl('span','font-mono font-bold '+(hasNext?'text-white':'text-gray-200'),[L2.destName+' '+minToDisplay(group.finalArr)]));
      s2Row.appendChild(s2Left);
      s2Row.appendChild(mkEl('span','text-[11px] font-mono text-gray-600',['~'+group.leg2Ride+' min']));
      step2.appendChild(s2Row);
      content.appendChild(step2);

      steps.appendChild(content);
      card.appendChild(steps);

      container.appendChild(card);
      isFirstGroup=false;
    });
    board.appendChild(container);
  }

  function setNow(){
    var n=utahToday();
    document.getElementById('dateInput').value=n.y+'-'+String(n.m).padStart(2,'0')+'-'+String(n.d).padStart(2,'0');
    document.getElementById('timeInput').value=String(n.h).padStart(2,'0')+':'+String(n.mi).padStart(2,'0');
  }
  function getInputs(){
    var dv=document.getElementById('dateInput').value.split('-').map(Number);
    var tv=document.getElementById('timeInput').value.split(':').map(Number);
    return{y:dv[0],m:dv[1],d:dv[2],h:tv[0],mi:tv[1]};
  }
  function update(){
    var inp=getInputs();
    render(inp.y,inp.m,inp.d,inp.h,inp.mi);
  }

  // Freshness tracking
  function formatAge(isoTs){
    if(!isoTs)return'unknown age';
    var t=new Date(isoTs).getTime();
    if(isNaN(t))return'unknown age';
    var s=Math.max(0,Math.floor((Date.now()-t)/1000));
    if(s<60)return'just now';
    var m=Math.floor(s/60);
    if(m<60)return m+'m ago';
    var h=Math.floor(m/60);
    if(h<24)return h+'h '+(m%60)+'m ago';
    var d=Math.floor(h/24);
    return d+'d '+(h%24)+'h ago';
  }
  function updateFreshnessLabel(){
    var el=document.getElementById('freshness');
    var t=GTFS.generatedAt?new Date(GTFS.generatedAt).getTime():0;
    var ageMs=t?Date.now()-t:Infinity;
    el.textContent='Schedule updated '+formatAge(GTFS.generatedAt);
    var stale=ageMs>8*3600000;
    el.className=stale?'text-amber-400':'text-gray-600';
  }
  var refreshInflight=false;
  function fetchFreshGTFS(){
    if(refreshInflight)return Promise.resolve();
    refreshInflight=true;
    var icon=document.getElementById('refreshIcon');
    icon.classList.add('animate-spin');
    return fetch('/gtfs_data.json?t='+Date.now(),{cache:'no-cache'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(fresh){
        var oldT=GTFS.generatedAt?new Date(GTFS.generatedAt).getTime():0;
        var newT=fresh.generatedAt?new Date(fresh.generatedAt).getTime():0;
        if(newT>=oldT&&fresh.stopTimes){
          GTFS=fresh;
          updateFeedNote();
          update();
        }
        updateFreshnessLabel();
      })
      .catch(function(e){console.warn('Refresh failed:',e)})
      .then(function(){
        icon.classList.remove('animate-spin');
        refreshInflight=false;
      });
  }
  document.getElementById('refreshBtn').addEventListener('click',fetchFreshGTFS);

  function updateModeButtons(){
    var activeCls='px-2.5 py-1 text-xs font-mono font-medium rounded-md transition-colors bg-surface-900 text-white shadow-sm';
    var inactiveCls='px-2.5 py-1 text-xs font-mono font-medium rounded-md transition-colors text-gray-500 hover:text-gray-300';
    var depBtn=document.getElementById('modeDepartBtn');
    var arrBtn=document.getElementById('modeArriveBtn');
    depBtn.className=MODE==='depart'?activeCls:inactiveCls;
    arrBtn.className=MODE==='arrive'?activeCls:inactiveCls;
    depBtn.setAttribute('aria-selected',MODE==='depart');
    arrBtn.setAttribute('aria-selected',MODE==='arrive');
  }
  function setMode(m){
    if(m===MODE)return;
    MODE=m;
    localStorage.setItem('transit.mode',MODE);
    updateModeButtons();
    update();
  }
  document.getElementById('modeDepartBtn').addEventListener('click',function(){setMode('depart')});
  document.getElementById('modeArriveBtn').addEventListener('click',function(){setMode('arrive')});

  function updateHeader(){
    var dir=DIRECTIONS[DIRECTION];
    document.getElementById('originName').textContent=dir.origin;
    document.getElementById('destName').textContent=dir.dest;
    document.getElementById('leg1Badge').textContent=dir.leg1.label;
    document.getElementById('leg1Badge').className='px-1.5 py-0.5 rounded bg-'+dir.leg1.color+'/20 text-'+dir.leg1.color+' font-mono font-medium text-[11px]';
    document.getElementById('leg2Badge').textContent=dir.leg2.label;
    document.getElementById('leg2Badge').className='px-1.5 py-0.5 rounded bg-'+dir.leg2.color+'/20 text-'+dir.leg2.color+' font-mono font-medium text-[11px]';
    document.getElementById('headerBar').className='h-8 w-1 rounded-full bg-gradient-to-b from-'+dir.leg1.color+' to-'+dir.leg2.color;
    document.getElementById('legendDot').className='w-2 h-2 rounded-full bg-'+dir.leg1.color;
    // Arrow always points right — text order already conveys direction
    document.title=dir.origin+' \u2192 '+dir.dest;
  }
  document.getElementById('swapBtn').addEventListener('click',function(){
    DIRECTION=DIRECTION==='toProvo'?'toAirport':'toProvo';
    localStorage.setItem('transit.direction',DIRECTION);
    updateHeader();
    update();
  });

  // Time stepper
  function parseTimeInput(){
    var v=document.getElementById('timeInput').value;
    if(!v)return 0;
    var p=v.split(':').map(Number);
    return p[0]*60+p[1];
  }
  function writeTimeInput(mins){
    mins=Math.max(0,Math.min(1439,mins));
    var h=Math.floor(mins/60),mi=mins%60;
    document.getElementById('timeInput').value=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
    syncTimeDisplay();
  }
  function syncTimeDisplay(){
    document.getElementById('timeDisplay').textContent=minToDisplay(parseTimeInput());
  }
  function stepTime(delta){
    var m=parseTimeInput();
    // Snap to 15-min grid
    var snapped=Math.round(m/15)*15;
    if(snapped===m) m=m+delta;
    else m=(delta>0?snapped+(snapped<=m?15:0):snapped-(snapped>=m?15:0));
    writeTimeInput(m);
    update();
  }
  function buildTimePopover(){
    var pop=document.getElementById('timePopover');
    clearEl(pop);
    var cur=parseTimeInput();
    var curSnap=Math.round(cur/15)*15;
    for(var m=4*60;m<=23*60+45;m+=15){
      (function(mm){
        var item=mkEl('button','block w-full text-left px-3 py-1.5 text-sm font-mono transition-colors '+(mm===curSnap?'bg-surface-900 text-white':'text-gray-400 hover:bg-surface-900/60 hover:text-white'),[minToDisplay(mm)]);
        item.type='button';
        item.addEventListener('click',function(){
          writeTimeInput(mm);
          closeTimePopover();
          update();
        });
        if(mm===curSnap) item.setAttribute('data-current','1');
        pop.appendChild(item);
      })(m);
    }
  }
  function openTimePopover(){
    buildTimePopover();
    var pop=document.getElementById('timePopover');
    pop.classList.remove('hidden');
    var cur=pop.querySelector('[data-current]');
    if(cur) cur.scrollIntoView({block:'center'});
    setTimeout(function(){document.addEventListener('click',outsideClickClose)},0);
  }
  function closeTimePopover(){
    document.getElementById('timePopover').classList.add('hidden');
    document.removeEventListener('click',outsideClickClose);
  }
  function outsideClickClose(e){
    if(!e.target.closest('#timePopover')&&!e.target.closest('#timeDisplay')) closeTimePopover();
  }
  document.getElementById('timePrev').addEventListener('click',function(){stepTime(-15)});
  document.getElementById('timeNext').addEventListener('click',function(){stepTime(15)});
  document.getElementById('timeDisplay').addEventListener('click',function(){
    var pop=document.getElementById('timePopover');
    if(pop.classList.contains('hidden')) openTimePopover(); else closeTimePopover();
  });

  document.getElementById('nowBtn').addEventListener('click',function(){setNow();syncTimeDisplay();update()});
  document.getElementById('dateInput').addEventListener('change',update);

  setInterval(function(){
    var n=utahToday(),inp=getInputs();
    if(inp.y===n.y&&inp.m===n.m&&inp.d===n.d){
      if(MODE==='depart'){
        document.getElementById('timeInput').value=String(n.h).padStart(2,'0')+':'+String(n.mi).padStart(2,'0');
        syncTimeDisplay();
      }
      update();
    }
  },30000);

  setNow();
  syncTimeDisplay();
  updateHeader();
  updateModeButtons();
  updateFreshnessLabel();
  setInterval(updateFreshnessLabel,30000);
  // Fetch fresh GTFS on load (background; swaps in if newer)
  fetchFreshGTFS();
  function updateFeedNote(){
    var note=document.getElementById('feedNote');
    var parts=[];
    if(GTFS.feedStart&&GTFS.feedEnd)
      parts.push(fmtDate(GTFS.feedStart)+' \u2013 '+fmtDate(GTFS.feedEnd));
    if(GTFS_EMBEDDED!==GTFS&&GTFS_EMBEDDED.feedStart&&GTFS_EMBEDDED.feedEnd)
      parts.push('fallback '+fmtDate(GTFS_EMBEDDED.feedStart)+' \u2013 '+fmtDate(GTFS_EMBEDDED.feedEnd));
    note.textContent=parts.length?'Schedule valid '+parts.join(' \u00b7 ')+' \u00b7 UTA GTFS data':'';
  }
  updateFeedNote();
  update();
})();
</script>
</body>
