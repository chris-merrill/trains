<!-- Maskable variant: full bleed, no corner rounding (the launcher supplies the
     shape), mark scaled to 78% and centred so it survives a circular crop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#FBF7EC"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)" stroke-linecap="round" fill="none">
    <line x1="128" y1="384" x2="256" y2="256" stroke="#2EB566" stroke-width="34"/>
    <line x1="256" y1="256" x2="384" y2="128" stroke="#C227B9" stroke-width="34"/>
    <circle cx="128" cy="384" r="36" fill="#FBF7EC" stroke="#2EB566" stroke-width="26"/>
    <circle cx="256" cy="256" r="30" fill="#FBF7EC" stroke="#14110C" stroke-width="22"/>
    <circle cx="384" cy="128" r="36" fill="#FBF7EC" stroke="#C227B9" stroke-width="26"/>
  </g>
</svg>
