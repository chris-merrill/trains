name: Refresh schedule
on:
  schedule:
    - cron: '0 10 * * *' # daily 10:00 UTC = 4am Mountain
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build fresh GTFS data from UTA feed
        run: |
          npm i --no-save adm-zip@0.5.16 csv-parse@5.5.6
          node scripts/build-gtfs.mjs
      - name: Commit refreshed data
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schedule changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gtfs_data.json index.html timetable.html
            git commit -m "Refresh GTFS schedule data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # DEPLOY DISABLED: the deployed site at transit-cm.web.app runs a NEWER
      # version of the app than this repo (the repo is a snapshot). Deploying
      # from here would overwrite it. Re-enable only after the production
      # source has been pushed to this repo. Until then this workflow is
      # commit-only: it keeps the repo's schedule data fresh every day.
