name: Refresh schedule
on:
  schedule:
    - cron: '0 10 * * *' # daily 10:00 UTC = 4am Mountain
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build fresh GTFS data from UTA feed
        run: |
          npm i --no-save adm-zip@0.5.16 csv-parse@5.5.6
          node scripts/build-gtfs.mjs
      - name: Commit refreshed data
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schedule changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gtfs_data.json index.html timetable.html
            git commit -m "Refresh GTFS schedule data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Deploys hosting only. Runtime data stays with the getSchedule Cloud
      # Function (it serves a richer schema incl. the Lehi/Adobe route);
      # this pipeline's job is keeping the embedded HTML fallbacks fresh.
      # Bot pushes don't trigger the deploy workflow, so deploy from here.
      - name: Deploy hosting
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT secret — data committed but not deployed"
            exit 0
          fi
          npm install -g firebase-tools@15.24.0
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            firebase deploy --project transit-cm --non-interactive --force --only hosting
