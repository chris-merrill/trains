name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy hosting
        run: |
          # DEPLOY DISABLED: transit-cm.web.app runs a NEWER version of the
          # app than this repo (the repo is a snapshot). Deploying from here
          # would overwrite production with the older UI. Re-enable only
          # after the production source has been pushed to this repo.
          echo "::warning::Deploys are disabled until this repo is synced with the production source — see workflow file comment"
